# Full local stack: infrastructure + application services
name: agricore

include:
  - path: docker-compose.infrastructure.yml

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-agricore}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agricore_dev_change_me}
  # Keep total pools under Postgres max_connections=200 (many services share one instance)
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

x-security-env: &security-env
  JWT_ISSUER: https://agricore.local/identity
  IDENTITY_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
  AGRICORE_DEV_MODE: "false"

# Internal Docker network listener (see PLAINTEXT://kafka:19092 in infrastructure compose)
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092

x-app-healthcheck: &app-healthcheck
  interval: 15s
  timeout: 5s
  retries: 12
  start_period: 90s

services:
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: agricore-identity
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*db-env]
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IDENTITY_PORT: 8081
      JWT_ISSUER: https://agricore.local/identity
      # Stable RSA keys across restarts (generate: scripts/generate-jwt-keys.ps1)
      AGRICORE_JWT_PRIVATE_KEY_PATH: /keys/private.pem
      AGRICORE_JWT_PUBLIC_KEY_PATH: /keys/public.pem
      # Local stack needs seed/e2e registration; fail-closed rate limit with Redis up
      AGRICORE_REGISTRATION_ENABLED: "true"
      AGRICORE_RATE_LIMIT_FAIL_OPEN: "false"
      AGRICORE_TRUST_FORWARDED_HEADERS: "true"
    volumes:
      - ./infrastructure/jwt:/keys:ro
    ports:
      - "8081:8081"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP || exit 1"]

  farm-service:
    build:
      context: .
      dockerfile: services/farm-service/Dockerfile
    container_name: agricore-farm
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env, *kafka-env]
      FARM_PORT: 8082
    ports:
      - "8082:8082"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q UP || exit 1"]

  crop-catalog-service:
    build:
      context: .
      dockerfile: services/crop-catalog-service/Dockerfile
    container_name: agricore-crop-catalog
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env]
      CROP_CATALOG_PORT: 8083
    ports:
      - "8083:8083"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health | grep -q UP || exit 1"]

  crop-cycle-service:
    build:
      context: .
      dockerfile: services/crop-cycle-service/Dockerfile
    container_name: agricore-crop-cycle
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env, *kafka-env]
      CROP_CYCLE_PORT: 8084
    ports:
      - "8084:8084"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/actuator/health | grep -q UP || exit 1"]

  work-service:
    build:
      context: .
      dockerfile: services/work-service/Dockerfile
    container_name: agricore-work
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env, *kafka-env]
      WORK_PORT: 8085
    ports:
      - "8085:8085"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health | grep -q UP || exit 1"]

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: agricore-inventory
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env, *kafka-env]
      INVENTORY_PORT: 8086
    ports:
      - "8086:8086"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/actuator/health | grep -q UP || exit 1"]

  harvest-service:
    build:
      context: .
      dockerfile: services/harvest-service/Dockerfile
    container_name: agricore-harvest
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env, *kafka-env]
      HARVEST_PORT: 8087
    ports:
      - "8087:8087"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8087/actuator/health | grep -q UP || exit 1"]

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: agricore-notification
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env]
      NOTIFICATION_PORT: 8089
    ports:
      - "8089:8089"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8089/actuator/health | grep -q UP || exit 1"]

  iot-service:
    build:
      context: .
      dockerfile: services/iot-service/Dockerfile
    container_name: agricore-iot
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env]
      IOT_PORT: 8090
    ports:
      - "8090:8090"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health | grep -q UP || exit 1"]

  sales-service:
    build:
      context: .
      dockerfile: services/sales-service/Dockerfile
    container_name: agricore-sales
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env]
      SALES_PORT: 8091
      INVENTORY_SERVICE_URL: http://inventory-service:8086
    ports:
      - "8091:8091"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/actuator/health | grep -q UP || exit 1"]

  traceability-service:
    build:
      context: .
      dockerfile: services/traceability-service/Dockerfile
    container_name: agricore-traceability
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env, *kafka-env]
      TRACEABILITY_PORT: 8092
      TRACEABILITY_PUBLIC_BASE_URL: http://localhost:8080/public/api/v1/traceability
    ports:
      - "8092:8092"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/actuator/health | grep -q UP || exit 1"]

  assistant-service:
    build:
      context: .
      dockerfile: services/assistant-service/Dockerfile
    container_name: agricore-assistant
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *security-env]
      ASSISTANT_PORT: 8093
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-none}
      ASSISTANT_OPENAI_API_KEY: ${ASSISTANT_OPENAI_API_KEY:-}
      ASSISTANT_OPENAI_BASE_URL: ${ASSISTANT_OPENAI_BASE_URL:-https://api.openai.com/v1}
      ASSISTANT_OPENAI_MODEL: ${ASSISTANT_OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8093:8093"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8093/actuator/health | grep -q UP || exit 1"]

  agricore-console:
    build:
      context: .
      dockerfile: apps/agricore-console/Dockerfile
    container_name: agricore-console
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      # Compose DNS name (Helm overrides to agricore-gateway:8080)
      GATEWAY_UPSTREAM: api-gateway:8080
    ports:
      - "5173:80"
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ | grep -qi html || exit 1"]

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: agricore-gateway
    depends_on:
      identity-service:
        condition: service_healthy
      farm-service:
        condition: service_healthy
      crop-catalog-service:
        condition: service_healthy
      crop-cycle-service:
        condition: service_healthy
      work-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      harvest-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      iot-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
      traceability-service:
        condition: service_healthy
      assistant-service:
        condition: service_healthy
    environment:
      GATEWAY_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-service:8081
      FARM_SERVICE_URL: http://farm-service:8082
      CROP_CATALOG_SERVICE_URL: http://crop-catalog-service:8083
      CROP_CYCLE_SERVICE_URL: http://crop-cycle-service:8084
      WORK_SERVICE_URL: http://work-service:8085
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      HARVEST_SERVICE_URL: http://harvest-service:8087
      NOTIFICATION_SERVICE_URL: http://notification-service:8089
      IOT_SERVICE_URL: http://iot-service:8090
      SALES_SERVICE_URL: http://sales-service:8091
      TRACEABILITY_SERVICE_URL: http://traceability-service:8092
      ASSISTANT_SERVICE_URL: http://assistant-service:8093
      JWT_ISSUER: https://agricore.local/identity
      IDENTITY_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
    ports:
      - "8080:8080"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
