{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agricore-console
  labels:
    app.kubernetes.io/name: agricore-console
    app.kubernetes.io/part-of: agricore
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.console.replicaCount | default 1 }}
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agricore-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agricore-console
        app.kubernetes.io/part-of: agricore
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: {{ include "agricore.imageRef" (dict "image" .Values.console.image "tag" .Values.global.imageTag "allowMutable" .Values.global.allowMutableImages "requireDigest" .Values.global.requireImageDigest) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.console.port }}
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agricore-console
  labels:
    app.kubernetes.io/name: agricore-console
    app.kubernetes.io/part-of: agricore
spec:
  selector:
    app.kubernetes.io/name: agricore-console
  ports:
    - port: {{ .Values.console.port }}
      targetPort: http
      name: http
{{- end }}
