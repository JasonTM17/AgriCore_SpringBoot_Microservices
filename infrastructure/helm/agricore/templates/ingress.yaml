{{- /*
  M4: same-origin browser edge.
  All browser traffic (/ and /api) hits the console Service; console nginx proxies
  /api to the gateway. Avoid split-host defaults that break HttpOnly refresh cookies.
*/ -}}
{{- if and .Values.ingress .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agricore
  labels:
    app.kubernetes.io/name: agricore
    app.kubernetes.io/part-of: agricore
    app.kubernetes.io/component: edge
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if and .Values.ingress.tls .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default "agricore-tls" | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Single front door: console SPA + same-origin /api reverse-proxy.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agricore-console
                port:
                  number: {{ .Values.console.port | default 8080 }}
{{- end }}
