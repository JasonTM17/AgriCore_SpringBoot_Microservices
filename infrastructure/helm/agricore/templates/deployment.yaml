{{- range $name, $svc := dict
  "identity" .Values.identity
  "farm" .Values.farm
  "gateway" .Values.gateway
}}
{{- if and $svc $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agricore-{{ $name }}
  labels:
    app.kubernetes.io/name: agricore-{{ $name }}
    app.kubernetes.io/part-of: agricore
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agricore-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agricore-{{ $name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            - name: POSTGRES_HOST
              value: {{ $.Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ $.Values.postgres.port | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agricore-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agricore-db
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.kafka.bootstrapServers | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml ($svc.resources | default (dict "requests" (dict "cpu" "100m" "memory" "256Mi") "limits" (dict "cpu" "500m" "memory" "512Mi"))) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agricore-{{ $name }}
  labels:
    app.kubernetes.io/name: agricore-{{ $name }}
spec:
  selector:
    app.kubernetes.io/name: agricore-{{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: http
      name: http
{{- end }}
{{- end }}
