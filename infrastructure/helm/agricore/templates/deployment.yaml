{{- /*
  All AgriCore microservices: one Deployment + Service each.
  Non-root, probes on Actuator, secrets from K8s Secret only.
*/ -}}
{{- $services := dict
  "identity" .Values.identity
  "farm" .Values.farm
  "crop-catalog" .Values.cropCatalog
  "crop-cycle" .Values.cropCycle
  "work" .Values.work
  "inventory" .Values.inventory
  "harvest" .Values.harvest
  "notification" .Values.notification
  "iot" .Values.iot
  "sales" .Values.sales
  "traceability" .Values.traceability
  "assistant" .Values.assistant
  "gateway" .Values.gateway
-}}
{{- range $name, $svc := $services }}
{{- if and $svc $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agricore-{{ $name }}
  labels:
    app.kubernetes.io/name: agricore-{{ $name }}
    app.kubernetes.io/part-of: agricore
    app.kubernetes.io/component: microservice
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agricore-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agricore-{{ $name }}
        app.kubernetes.io/part-of: agricore
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            - name: POSTGRES_HOST
              value: {{ $.Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ $.Values.postgres.port | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.databaseSecretName | quote }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.databaseSecretName | quote }}
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.kafka.bootstrapServers | quote }}
            - name: JWT_ISSUER
              value: {{ $.Values.jwtIssuer | quote }}
            - name: IDENTITY_JWKS_URI
              value: {{ $.Values.identityJwksUri | quote }}
            - name: AGRICORE_DEV_MODE
              value: "false"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES_HISTOGRAM_HTTP_SERVER_REQUESTS
              value: "true"
            {{- if $.Values.observability.structuredLogging }}
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: "ecs"
            - name: LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT
              value: {{ $.Values.observability.environment | quote }}
            {{- end }}
            {{- if $.Values.observability.otlpTracingEndpoint }}
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: {{ $.Values.observability.otlpTracingEndpoint | quote }}
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: {{ $.Values.observability.samplingProbability | quote }}
            {{- end }}
            {{- if or (eq $name "crop-cycle") (eq $name "work") (eq $name "harvest") (eq $name "iot") }}
            - name: FARM_SERVICE_URL
              value: {{ $.Values.farmAccess.serviceUrl | quote }}
            - name: FARM_SERVICE_ALLOWED_HOSTS
              value: {{ $.Values.farmAccess.allowedHosts | quote }}
            - name: FARM_SERVICE_ALLOW_INSECURE_HTTP
              value: {{ $.Values.farmAccess.allowInsecureHttp | quote }}
            {{- end }}
            {{- if eq $name "identity" }}
            - name: REDIS_HOST
              value: {{ $.Values.redis.host | default "redis" | quote }}
            - name: REDIS_PORT
              value: {{ $.Values.redis.port | default "6379" | quote }}
            - name: IDENTITY_PORT
              value: {{ $svc.port | quote }}
            - name: AGRICORE_REGISTRATION_ENABLED
              value: {{ $.Values.identity.registrationEnabled | default false | quote }}
            - name: AGRICORE_RATE_LIMIT_FAIL_OPEN
              value: "false"
            - name: AGRICORE_TRUST_FORWARDED_HEADERS
              value: {{ $.Values.identity.trustForwardedHeaders | default true | quote }}
            {{- end }}
            {{- if eq $name "sales" }}
            - name: INVENTORY_SERVICE_URL
              value: {{ $.Values.sales.inventoryServiceUrl | default "http://agricore-inventory:8086" | quote }}
            - name: SALES_PORT
              value: {{ $svc.port | quote }}
            {{- end }}
            {{- if eq $name "notification" }}
            - name: NOTIFICATION_PORT
              value: {{ $svc.port | quote }}
            - name: NOTIFICATION_DELIVERY_PROVIDER
              value: {{ $svc.deliveryProvider | default "smtp" | quote }}
            - name: NOTIFICATION_SMTP_HOST
              value: {{ $svc.smtp.host | quote }}
            - name: NOTIFICATION_SMTP_PORT
              value: {{ $svc.smtp.port | quote }}
            - name: NOTIFICATION_SMTP_FROM
              value: {{ $svc.smtp.fromAddress | quote }}
            - name: NOTIFICATION_SMTP_AUTH
              value: {{ $svc.smtp.auth | quote }}
            - name: NOTIFICATION_SMTP_STARTTLS
              value: {{ $svc.smtp.startTls | quote }}
            - name: NOTIFICATION_SMTP_STARTTLS_REQUIRED
              value: {{ $svc.smtp.startTlsRequired | quote }}
            {{- if $svc.smtp.auth }}
            - name: NOTIFICATION_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.smtp.credentialSecretName | quote }}
                  key: {{ $svc.smtp.usernameKey | default "username" | quote }}
            - name: NOTIFICATION_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.smtp.credentialSecretName | quote }}
                  key: {{ $svc.smtp.passwordKey | default "password" | quote }}
            {{- end }}
            - name: NOTIFICATION_DELIVERY_MAX_ATTEMPTS
              value: {{ $svc.delivery.maxAttempts | default 3 | quote }}
            - name: NOTIFICATION_DELIVERY_LEASE
              value: {{ $svc.delivery.lease | default "PT30S" | quote }}
            - name: NOTIFICATION_DELIVERY_RECOVERY_POLL_MS
              value: {{ $svc.delivery.recoveryPollMs | default 30000 | quote }}
            - name: NOTIFICATION_DELIVERY_RECOVERY_BATCH_SIZE
              value: {{ $svc.delivery.recoveryBatchSize | default 50 | quote }}
            {{- end }}
            {{- if eq $name "assistant" }}
            - name: ASSISTANT_PORT
              value: {{ $svc.port | quote }}
            - name: REDIS_HOST
              value: {{ $.Values.redis.host | default "redis" | quote }}
            - name: REDIS_PORT
              value: {{ $.Values.redis.port | default "6379" | quote }}
            - name: ASSISTANT_PROVIDER
              value: {{ $svc.provider | default "none" | quote }}
            - name: ASSISTANT_PROVIDER_MODEL
              value: {{ $svc.providerModel | default "" | quote }}
            - name: ASSISTANT_PROVIDER_BASE_URL
              value: {{ $svc.providerBaseUrl | default "" | quote }}
            - name: ASSISTANT_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.providerSecretName | quote }}
                  key: {{ $svc.providerApiKeyKey | default "api-key" | quote }}
                  optional: true
            - name: ASSISTANT_TOOLS_ENABLED
              value: {{ $svc.toolsEnabled | default false | quote }}
            - name: ASSISTANT_FARM_TOOL_BASE_URL
              value: {{ $svc.farmToolBaseUrl | quote }}
            - name: ASSISTANT_TOOL_ALLOWED_HOSTS
              value: {{ $svc.toolAllowedHosts | quote }}
            - name: ASSISTANT_TOOL_ALLOW_INSECURE_HTTP
              value: {{ $svc.toolAllowInsecureHttp | default false | quote }}
            - name: ASSISTANT_BUDGET_TRUST_FORWARDED_HEADERS
              value: {{ $svc.trustForwardedHeaders | default false | quote }}
            {{- end }}
            {{- if eq $name "gateway" }}
            - name: IDENTITY_SERVICE_URL
              value: {{ $.Values.gateway.identityServiceUrl | default "http://agricore-identity:8081" | quote }}
            - name: FARM_SERVICE_URL
              value: {{ $.Values.gateway.farmServiceUrl | default "http://agricore-farm:8082" | quote }}
            - name: CROP_CATALOG_SERVICE_URL
              value: {{ $.Values.gateway.cropCatalogServiceUrl | default "http://agricore-crop-catalog:8083" | quote }}
            - name: CROP_CYCLE_SERVICE_URL
              value: {{ $.Values.gateway.cropCycleServiceUrl | default "http://agricore-crop-cycle:8084" | quote }}
            - name: WORK_SERVICE_URL
              value: {{ $.Values.gateway.workServiceUrl | default "http://agricore-work:8085" | quote }}
            - name: INVENTORY_SERVICE_URL
              value: {{ $.Values.gateway.inventoryServiceUrl | default "http://agricore-inventory:8086" | quote }}
            - name: HARVEST_SERVICE_URL
              value: {{ $.Values.gateway.harvestServiceUrl | default "http://agricore-harvest:8087" | quote }}
            - name: NOTIFICATION_SERVICE_URL
              value: {{ $.Values.gateway.notificationServiceUrl | default "http://agricore-notification:8089" | quote }}
            - name: IOT_SERVICE_URL
              value: {{ $.Values.gateway.iotServiceUrl | default "http://agricore-iot:8090" | quote }}
            - name: SALES_SERVICE_URL
              value: {{ $.Values.gateway.salesServiceUrl | default "http://agricore-sales:8091" | quote }}
            - name: TRACEABILITY_SERVICE_URL
              value: {{ $.Values.gateway.traceabilityServiceUrl | default "http://agricore-traceability:8092" | quote }}
            - name: ASSISTANT_SERVICE_URL
              value: {{ $.Values.gateway.assistantServiceUrl | default "http://agricore-assistant:8093" | quote }}
            - name: GATEWAY_PORT
              value: {{ $svc.port | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ $svc.readOnlyRootFilesystem | default false }}
            capabilities:
              drop: ["ALL"]
          {{- if $svc.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml ($svc.resources | default (dict "requests" (dict "cpu" "100m" "memory" "256Mi") "limits" (dict "cpu" "500m" "memory" "512Mi"))) | nindent 12 }}
      {{- if $svc.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: agricore-{{ $name }}
  labels:
    app.kubernetes.io/name: agricore-{{ $name }}
    app.kubernetes.io/part-of: agricore
spec:
  selector:
    app.kubernetes.io/name: agricore-{{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: http
      name: http
{{- end }}
{{- end }}
