{{/*
Credentials are intentionally not rendered by this chart. Create the Secret
named by each enabled non-gateway service's databaseSecretName before install,
or manage them through an external secret operator. Required keys: username
and password. The provisioning Secret named by
postgres.provisioning.credentialSecretName is separate and is mounted only in
the database hook Jobs.

Create the Secret named by identity.jwtSigningSecretName before install.
It must contain the PEM keys named by identity.jwtPrivateKeyKey and
identity.jwtPublicKeyKey. The chart mounts them read-only; never put PEM data
in values files.

When notification.smtp.auth is true, also create the Secret named by
notification.smtp.credentialSecretName. Its key names are configured by
notification.smtp.usernameKey and notification.smtp.passwordKey.

When iot.mqtt.enabled and iot.mqtt.auth.enabled are true, create the Secret
named by iot.mqtt.auth.credentialSecretName. Its key names are configured by
iot.mqtt.auth.usernameKey and iot.mqtt.auth.passwordKey.

Create the Secret named by clientIp.signingSecretName before install. Its key
clientIp.signingSecretKey is mounted only by Gateway, Identity, and Assistant
to authenticate the gateway-issued canonical client-IP header.
*/}}
