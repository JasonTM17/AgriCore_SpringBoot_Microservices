{{/*
Credentials are intentionally not rendered by this chart. Create the Secret
named by postgres.databaseSecretName before install, or manage it through an
external secret operator. Required keys: username and password.

When notification.smtp.auth is true, also create the Secret named by
notification.smtp.credentialSecretName. Its key names are configured by
notification.smtp.usernameKey and notification.smtp.passwordKey.

When iot.mqtt.enabled and iot.mqtt.auth.enabled are true, create the Secret
named by iot.mqtt.auth.credentialSecretName. Its key names are configured by
iot.mqtt.auth.usernameKey and iot.mqtt.auth.passwordKey.
*/}}
