{{- if and .Values.assistant.enabled .Values.postgres.provisioningEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: agricore-assistant-database
  labels:
    app.kubernetes.io/name: agricore-assistant-database
    app.kubernetes.io/part-of: agricore
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agricore-assistant-database
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: {{ .Values.postgres.provisioningImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres; do sleep 2; done
              exists="$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'agricore_assistant'")"
              if [ "$exists" != "1" ]; then
                psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE agricore_assistant'
              fi
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.databaseSecretName | quote }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.databaseSecretName | quote }}
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
