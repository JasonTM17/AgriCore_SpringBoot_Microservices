{{- if and .Values.assistant.enabled .Values.postgres.provisioning.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: agricore-assistant-database
  labels:
    app.kubernetes.io/name: agricore-assistant-database
    app.kubernetes.io/part-of: agricore
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
spec:
  activeDeadlineSeconds: {{ .Values.postgres.provisioning.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.postgres.provisioning.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.postgres.provisioning.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agricore-assistant-database
        app.kubernetes.io/part-of: agricore
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: {{ required "postgres.provisioning.image is required" .Values.postgres.provisioning.image | quote }}
          imagePullPolicy: {{ .Values.postgres.provisioning.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              attempt=1
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres; do
                if [ "$attempt" -ge "$PROVISION_MAX_ATTEMPTS" ]; then
                  echo "PostgreSQL did not become ready after $attempt attempts" >&2
                  exit 1
                fi
                attempt=$((attempt + 1))
                sleep "$PROVISION_RETRY_SECONDS"
              done

              exists="$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'agricore_assistant'")"
              if [ "$exists" != "1" ]; then
                psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE agricore_assistant'
              fi
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.provisioning.credentialSecretName is required" .Values.postgres.provisioning.credentialSecretName | quote }}
                  key: {{ .Values.postgres.provisioning.usernameKey | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.provisioning.credentialSecretName is required" .Values.postgres.provisioning.credentialSecretName | quote }}
                  key: {{ .Values.postgres.provisioning.passwordKey | quote }}
            - name: PROVISION_MAX_ATTEMPTS
              value: {{ .Values.postgres.provisioning.maxAttempts | quote }}
            - name: PROVISION_RETRY_SECONDS
              value: {{ .Values.postgres.provisioning.retrySeconds | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
