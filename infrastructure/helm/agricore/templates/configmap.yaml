apiVersion: v1
kind: ConfigMap
metadata:
  name: agricore-runtime-config
  labels:
    app.kubernetes.io/name: agricore-runtime-config
    app.kubernetes.io/part-of: agricore
data:
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers | quote }}
  JWT_ISSUER: {{ .Values.jwtIssuer | quote }}
  IDENTITY_JWKS_URI: {{ .Values.identityJwksUri | quote }}
  AGRICORE_DEV_MODE: "false"
  OUTBOX_PUBLISHER_RETRY_WRITE_STATE_ENABLED: {{ .Values.global.outbox.retry.writeStateEnabled | quote }}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
