global:
  imageRegistry: nguyenson1710
  # CI/release jobs must override this with the full 40-character commit SHA.
  # Leave empty locally to fail closed instead of silently rendering a mutable tag.
  imageTag: ""
  # Development-only escape hatch for a named non-latest tag. Keep false in
  # production and never commit an environment override that enables it.
  allowMutableImages: false
  # Release values must pin each service image as repository@sha256:<digest>.
  # CI can set this false only while validating candidate commit-SHA tags.
  requireImageDigest: true
  imagePullPolicy: IfNotPresent
  outbox:
    retry:
      # Keep false for the first compatible-image rollout. Enable only after
      # every replica understands deferred/quarantined outbox state.
      writeStateEnabled: false

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

pdb:
  enabled: false
  maxUnavailable: 1

networkPolicy:
  enabled: true
  # Keep egress open by default because PostgreSQL, Redis, Kafka, SMTP, MQTT,
  # and OTLP backends are operator-provided. Set restrictEgress=true only with
  # explicit dependency rules below once namespaces or CIDRs are known.
  restrictEgress: false
  # Full NetworkPolicy egress entries appended after DNS and same-namespace
  # AgriCore traffic. Example:
  # additionalEgress:
  #   - to:
  #       - ipBlock: { cidr: 10.40.0.0/16 }
  #     ports:
  #       - { protocol: TCP, port: 5432 }
  additionalEgress: []

# Each entry maps to Deployment+Service in templates/deployment.yaml
identity:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-identity
  port: 8081
  databaseSecretName: agricore-identity-db
  jwtSigningSecretName: agricore-identity-jwt
  jwtPrivateKeyKey: private-key.pem
  jwtPublicKeyKey: public-key.pem
  # Exact external browser origin for cookie-backed login, refresh, and logout.
  # With ingress enabled it must stay synchronized with ingress.host; the chart
  # rejects a wildcard, extra, or mismatched origin instead of restoring the
  # application-local development defaults.
  webAllowedOrigins: "https://agricore.local"
  # HTTPS browser sessions must keep refresh cookies Secure. This may be false
  # only for an explicit local HTTP render with ingress disabled.
  refreshCookieSecure: true
  # Production: public self-register off; create users via admin/invite
  registrationEnabled: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

farm:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-farm
  port: 8082
  databaseSecretName: agricore-farm-db

cropCatalog:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-crop-catalog
  port: 8083
  databaseSecretName: agricore-crop-catalog-db

cropCycle:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-crop-cycle
  port: 8084
  databaseSecretName: agricore-crop-cycle-db

work:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-work
  port: 8085
  databaseSecretName: agricore-work-db

inventory:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-inventory
  port: 8086
  databaseSecretName: agricore-inventory-db
  internalCredentialSecretName: agricore-inventory-internal
  internalCredentialTokenKey: token

harvest:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-harvest
  port: 8087
  databaseSecretName: agricore-harvest-db
  inventoryServiceUrl: http://agricore-inventory:8086
  inventoryServiceAllowedHosts: agricore-inventory
  inventoryServiceAllowInsecureHttp: true

notification:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-notification
  port: 8089
  databaseSecretName: agricore-notification-db
  deliveryProvider: smtp
  smtp:
    host: smtp.example.invalid
    port: 587
    fromAddress: no-reply@agricore.local
    auth: true
    startTls: true
    startTlsRequired: true
    credentialSecretName: agricore-notification-smtp
    usernameKey: username
    passwordKey: password
  delivery:
    maxAttempts: 3
    lease: PT30S
    recoveryPollMs: 30000
    recoveryBatchSize: 50

iot:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-iot
  port: 8090
  databaseSecretName: agricore-iot-db
  timescalePreflight:
    # Mandatory by default. Set unsafeSkip=true only when an equivalent
    # operator-controlled preflight has already verified the external IoT DB.
    unsafeSkip: false
    # Pinned OCI index for postgres:16.14-alpine3.24 (verified 2026-07-27).
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    imagePullPolicy: IfNotPresent
    database: agricore_iot
    # Least-privilege IoT database role; never reuse the provisioning role.
    credentialSecretName: agricore-iot-db
    usernameKey: username
    passwordKey: password
    maxAttempts: 30
    retrySeconds: 2
    activeDeadlineSeconds: 180
    backoffLimit: 2
    ttlSecondsAfterFinished: 300
  mqtt:
    enabled: false
    broker: ssl://mqtt.example.invalid:8883
    allowInsecure: false
    # Empty uses the Kubernetes pod name, keeping client IDs unique per replica.
    clientId: ""
    topic: agricore/telemetry/+/reading
    qos: 1
    maxReadingAge: P30D
    maxFutureSkew: PT5M
    auth:
      enabled: true
      credentialSecretName: agricore-iot-mqtt
      usernameKey: username
      passwordKey: password

sales:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-sales
  port: 8091
  databaseSecretName: agricore-sales-db
  inventoryServiceUrl: http://agricore-inventory:8086

traceability:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-traceability
  port: 8092
  databaseSecretName: agricore-traceability-db

assistant:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-assistant
  port: 8093
  databaseSecretName: agricore-assistant-db
  provider: none
  providerModel: ""
  providerBaseUrl: ""
  providerSecretName: agricore-assistant-provider
  providerApiKeyKey: api-key
  toolsEnabled: true
  farmToolBaseUrl: http://agricore-farm:8082
  toolAllowedHosts: agricore-farm
  toolAllowInsecureHttp: true
  archivedConversationRetention: P90D
  auditRetention: P365D
  generationEventRetention: PT24H
  retentionCleanupEnabled: true
  retentionCleanupInterval: PT1H
  retentionCleanupBatchSize: 250
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 750m, memory: 768Mi }

console:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-console
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

gateway:
  enabled: true
  replicaCount: 1
  image: nguyenson1710/agricore-gateway
  port: 8080
  # Required when ingress.enabled=true. Match only the proxy/LB source
  # addresses permitted to supply a canonical client address.
  trustedProxyAddressPattern: ""
  identityServiceUrl: http://agricore-identity:8081
  farmServiceUrl: http://agricore-farm:8082
  cropCatalogServiceUrl: http://agricore-crop-catalog:8083
  cropCycleServiceUrl: http://agricore-crop-cycle:8084
  workServiceUrl: http://agricore-work:8085
  inventoryServiceUrl: http://agricore-inventory:8086
  harvestServiceUrl: http://agricore-harvest:8087
  notificationServiceUrl: http://agricore-notification:8089
  iotServiceUrl: http://agricore-iot:8090
  salesServiceUrl: http://agricore-sales:8091
  traceabilityServiceUrl: http://agricore-traceability:8092
  assistantServiceUrl: http://agricore-assistant:8093

postgres:
  host: postgres
  port: 5432
  provisioning:
    enabled: true
    # Pinned OCI index for postgres:16.14-alpine3.24 (verified 2026-07-27).
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    imagePullPolicy: IfNotPresent
    # Dedicated role permitted to create databases; do not mount it in apps.
    credentialSecretName: agricore-postgres-provisioner
    usernameKey: username
    passwordKey: password
    maxAttempts: 30
    retrySeconds: 2
    activeDeadlineSeconds: 180
    backoffLimit: 2
    ttlSecondsAfterFinished: 300

clientIp:
  # Shared only by Gateway, Identity, and Assistant to authenticate the
  # gateway-issued canonical client-IP header. Create this Secret externally.
  signingSecretName: agricore-client-ip
  signingSecretKey: signing-secret

redis:
  host: redis
  port: 6379

kafka:
  # Internal cluster bootstrap (match compose PLAINTEXT listener)
  bootstrapServers: kafka:19092

observability:
  environment: production
  structuredLogging: true
  # Leave empty when no collector is installed; set an OTLP/HTTP traces endpoint to enable export.
  otlpTracingEndpoint: ""
  samplingProbability: 0.1

farmAccess:
  serviceUrl: http://agricore-farm:8082
  allowedHosts: agricore-farm
  # Current chart has no service-mesh TLS; set false when serviceUrl uses HTTPS.
  allowInsecureHttp: true

cropCycleAccess:
  serviceUrl: http://agricore-crop-cycle:8084
  allowedHosts: agricore-crop-cycle
  # Current chart has no service-mesh TLS; set false when serviceUrl uses HTTPS.
  allowInsecureHttp: true

identityJwksUri: http://agricore-identity:8081/.well-known/jwks.json
jwtIssuer: https://agricore.local/identity

ingress:
  enabled: false
  className: nginx
  host: agricore.local
  annotations: {}
  tls: []
