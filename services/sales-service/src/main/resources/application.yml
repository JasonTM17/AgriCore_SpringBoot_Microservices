server:
  port: ${SALES_PORT:8091}
spring:
  application:
    name: sales-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/agricore_sales
    username: ${POSTGRES_USER:agricore}
    password: ${POSTGRES_PASSWORD:agricore_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
agricore:
  security:
    issuer: ${JWT_ISSUER:https://agricore.local/identity}
    jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    dev-mode: ${AGRICORE_DEV_MODE:false}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8086}
    # Bounds the saga's reserve/confirm/release calls. Read timeout is the one that matters:
    # a stalled inventory would otherwise hold the request thread and the reservation open.
    connect-timeout-ms: ${INVENTORY_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${INVENTORY_READ_TIMEOUT_MS:5000}
