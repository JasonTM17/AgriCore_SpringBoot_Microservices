server:
  port: ${HARVEST_PORT:8087}
spring:
  application:
    name: harvest-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/agricore_harvest
    username: ${POSTGRES_USER:agricore}
    password: ${POSTGRES_PASSWORD:agricore_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
agricore:
  security:
    issuer: ${JWT_ISSUER:https://agricore.local/identity}
    jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    dev-mode: ${AGRICORE_DEV_MODE:false}
  farm-access:
    base-url: ${FARM_SERVICE_URL:http://localhost:8082}
    allowed-hosts: ${FARM_SERVICE_ALLOWED_HOSTS:localhost,127.0.0.1,::1,farm-service}
    allow-insecure-http: ${FARM_SERVICE_ALLOW_INSECURE_HTTP:false}
  outbox:
    publisher:
      enabled: true
      poll-ms: 1000
