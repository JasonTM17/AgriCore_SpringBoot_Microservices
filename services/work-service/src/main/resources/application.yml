server:
  port: ${WORK_PORT:8085}
spring:
  application:
    name: work-service
  servlet:
    multipart:
      max-file-size: ${WORK_ATTACHMENT_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${WORK_ATTACHMENT_MAX_REQUEST_SIZE:11MB}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/agricore_work
    username: ${POSTGRES_USER:agricore}
    password: ${POSTGRES_PASSWORD:agricore_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/postgresql-migration
    postgresql:
      transactional-lock: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
agricore:
  security:
    issuer: ${JWT_ISSUER:https://agricore.local/identity}
    jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    dev-mode: ${AGRICORE_DEV_MODE:false}
  farm-access:
    base-url: ${FARM_SERVICE_URL:http://localhost:8082}
    allowed-hosts: ${FARM_SERVICE_ALLOWED_HOSTS:localhost,127.0.0.1,::1,farm-service}
    allow-insecure-http: ${FARM_SERVICE_ALLOW_INSECURE_HTTP:false}
  inventory-access:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8086}
    internal-service-token: ${INVENTORY_INTERNAL_SERVICE_TOKEN:}
    allowed-hosts: ${INVENTORY_SERVICE_ALLOWED_HOSTS:localhost,127.0.0.1,::1,inventory-service}
    allow-insecure-http: ${INVENTORY_SERVICE_ALLOW_INSECURE_HTTP:false}
    connect-timeout: ${INVENTORY_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${INVENTORY_SERVICE_READ_TIMEOUT:3s}
    max-response-bytes: ${INVENTORY_SERVICE_MAX_RESPONSE_BYTES:8192}
  object-storage:
    enabled: ${OBJECT_STORAGE_ENABLED:false}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    bucket: ${OBJECT_STORAGE_BUCKET:agricore-work-attachments}
    allowed-hosts: ${OBJECT_STORAGE_ALLOWED_HOSTS:localhost,127.0.0.1,::1,minio}
    allow-insecure-http: ${OBJECT_STORAGE_ALLOW_INSECURE_HTTP:false}
    download-url-ttl: ${OBJECT_STORAGE_DOWNLOAD_URL_TTL:15m}
    max-upload-size: ${WORK_ATTACHMENT_MAX_UPLOAD_SIZE:10MB}
    max-attachments-per-task: ${WORK_ATTACHMENT_MAX_PER_TASK:20}
  outbox:
    publisher:
      enabled: true
      poll-ms: 1000
      send-timeout-ms: ${OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:10000}
      retry:
        write-state-enabled: ${OUTBOX_PUBLISHER_RETRY_WRITE_STATE_ENABLED:false}
        base-delay-ms: ${OUTBOX_PUBLISHER_RETRY_BASE_DELAY_MS:1000}
        max-delay-ms: ${OUTBOX_PUBLISHER_RETRY_MAX_DELAY_MS:60000}
        max-attempts: ${OUTBOX_PUBLISHER_MAX_ATTEMPTS:10}
