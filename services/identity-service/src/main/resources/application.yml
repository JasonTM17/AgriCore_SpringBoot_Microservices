server:
  port: ${IDENTITY_PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/agricore_identity
    username: ${POSTGRES_USER:agricore}
    password: ${POSTGRES_PASSWORD:agricore_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

agricore:
  security:
    issuer: ${JWT_ISSUER:https://agricore.local/identity}
    audience: agricore-api
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
    bcrypt-strength: 12
    max-failed-logins: 5
    lockout-duration-minutes: 15
    login-rate-limit-per-minute: 20
    private-key-path: ${AGRICORE_JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${AGRICORE_JWT_PUBLIC_KEY_PATH:}

logging:
  level:
    root: INFO
    com.agricore.identity: INFO
  pattern:
    console: "%d{ISO8601} %-5level [%X{traceId:-}] [%X{correlationId:-}] %logger{36} - %msg%n"
