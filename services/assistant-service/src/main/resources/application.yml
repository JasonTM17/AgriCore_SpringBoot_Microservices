server:
  port: ${ASSISTANT_PORT:8093}
spring:
  application:
    name: assistant-service
  ai:
    model:
      chat: none
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/agricore_assistant
    username: ${POSTGRES_USER:agricore}
    password: ${POSTGRES_PASSWORD:agricore_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

agricore:
  assistant:
    provider:
      type: ${ASSISTANT_PROVIDER:none}
    retention:
      archived-conversation: ${ASSISTANT_ARCHIVED_CONVERSATION_RETENTION:P90D}
      audit-event: ${ASSISTANT_AUDIT_RETENTION:P365D}
  security:
    issuer: ${JWT_ISSUER:https://agricore.local/identity}
    jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    dev-mode: ${AGRICORE_DEV_MODE:false}
