spring:
  datasource:
    url: jdbc:h2:mem:assistant;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/jwks

agricore:
  security:
    issuer: https://agricore.test/identity
    jwk-set-uri: http://localhost:9999/jwks
    audience: agricore-api
    dev-mode: true
  assistant:
    provider: test
    openai-base-url: http://localhost
    openai-api-key: test-key
    openai-model: test
    max-output-tokens: 256
