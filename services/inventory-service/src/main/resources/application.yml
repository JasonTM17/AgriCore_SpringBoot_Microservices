server:
  port: ${INVENTORY_PORT:8086}
spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/agricore_inventory
    username: ${POSTGRES_USER:agricore}
    password: ${POSTGRES_PASSWORD:agricore_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/postgresql-migration
    postgresql:
      transactional-lock: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
agricore:
  inventory:
    internal:
      service-token: ${INVENTORY_INTERNAL_SERVICE_TOKEN:}
  security:
    issuer: ${JWT_ISSUER:https://agricore.local/identity}
    jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    dev-mode: ${AGRICORE_DEV_MODE:false}
  farm-access:
    base-url: ${FARM_SERVICE_URL:http://localhost:8082}
    allowed-hosts: ${FARM_SERVICE_ALLOWED_HOSTS:localhost,127.0.0.1,::1,farm-service}
    allow-insecure-http: ${FARM_SERVICE_ALLOW_INSECURE_HTTP:false}
  kafka:
    consumer:
      enabled: true
    topics:
      harvest-events: agricore.harvest.events
  outbox:
    publisher:
      enabled: true
      poll-ms: 1000
      send-timeout-ms: ${OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:10000}
      retry:
        write-state-enabled: ${OUTBOX_PUBLISHER_RETRY_WRITE_STATE_ENABLED:false}
        base-delay-ms: ${OUTBOX_PUBLISHER_RETRY_BASE_DELAY_MS:1000}
        max-delay-ms: ${OUTBOX_PUBLISHER_RETRY_MAX_DELAY_MS:60000}
        max-attempts: ${OUTBOX_PUBLISHER_MAX_ATTEMPTS:10}
