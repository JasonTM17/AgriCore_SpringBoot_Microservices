server:
  port: ${IOT_PORT:8090}
spring:
  application:
    name: iot-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/agricore_iot
    username: ${POSTGRES_USER:agricore}
    password: ${POSTGRES_PASSWORD:agricore_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
agricore:
  security:
    dev-mode: ${AGRICORE_DEV_MODE:false}
  alert:
    cooldown-minutes: ${IOT_ALERT_COOLDOWN_MINUTES:15}
