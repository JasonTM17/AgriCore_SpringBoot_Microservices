spring:
  datasource:
    url: jdbc:h2:mem:trace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

agricore:
  public-base-url: http://localhost:8080/public/api/v1/traceability
  security:
    dev-mode: true
    issuer: https://agricore.test/identity
    jwk-set-uri: http://localhost:8081/.well-known/jwks.json
  kafka:
    consumer:
      enabled: false
