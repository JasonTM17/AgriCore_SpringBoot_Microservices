server:
  port: ${TRACEABILITY_PORT:8092}
spring:
  application:
    name: traceability-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/agricore_traceability
    username: ${POSTGRES_USER:agricore}
    password: ${POSTGRES_PASSWORD:agricore_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: traceability-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}
    listener:
      ack-mode: record
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
agricore:
  public-base-url: ${TRACEABILITY_PUBLIC_BASE_URL:http://localhost:8080/public/api/v1/traceability}
  security:
    issuer: ${JWT_ISSUER:https://agricore.local/identity}
    jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    dev-mode: ${AGRICORE_DEV_MODE:false}
  kafka:
    retry:
      attempts: ${AGRICORE_KAFKA_RETRY_ATTEMPTS:4}
      delay-ms: ${AGRICORE_KAFKA_RETRY_DELAY_MS:1000}
      multiplier: ${AGRICORE_KAFKA_RETRY_MULTIPLIER:2}
      max-delay-ms: ${AGRICORE_KAFKA_RETRY_MAX_DELAY_MS:8000}
      timeout-ms: ${AGRICORE_KAFKA_RETRY_TIMEOUT_MS:30000}
      auto-create-topics: ${AGRICORE_KAFKA_RETRY_AUTO_CREATE_TOPICS:false}
    consumer:
      enabled: true
      group-id: traceability-service
    topics:
      harvest-events: agricore.harvest.events
  outbox:
    publisher:
      enabled: true
      poll-ms: 1000
      send-timeout-ms: ${OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:10000}
