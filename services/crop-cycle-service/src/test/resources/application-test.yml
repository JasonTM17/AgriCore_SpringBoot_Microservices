spring:
  datasource:
    url: jdbc:h2:mem:cropcycle;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

agricore:
  security:
    dev-mode: true
    issuer: https://agricore.test/identity
    jwk-set-uri: http://localhost:8081/.well-known/jwks.json
