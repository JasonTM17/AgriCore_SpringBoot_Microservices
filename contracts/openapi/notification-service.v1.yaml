openapi: 3.1.0
info:
  title: AgriCore Notification Service API
  version: 1.4.0
  description: |
    Authorized direct notification delivery, a persisted in-app inbox, and idempotent
    Kafka-driven notifications. Delivery is persisted as REQUESTED before transitioning
    to SENT or FAILED. External channels use at-most-once automatic delivery: an
    interrupted delivery is recorded as FAILED with DELIVERY_OUTCOME_UNKNOWN instead
    of being resent. IN_APP delivery can be retried safely by notification ID.
    The service also consumes the exact UserRegistered.v1 identity event and creates
    one durable welcome-email delivery per event ID.
servers:
  - url: http://localhost:8089
paths:
  /api/v1/notifications:
    post:
      summary: Deliver a notification
      description: |
        Requires both ROLE_SYSTEM_ADMIN and PERMISSION_NOTIFICATION_ADMIN.
        `idempotencyKey` may be reused only with the same channel, recipient, subject,
        and body. A FAILED response is a persisted delivery outcome and still returns 201.
        `failureRetryable` describes the adapter result; external channels are never
        retried automatically because SMTP/SMS cannot guarantee provider idempotency.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
      responses:
        '201':
          description: Persisted delivery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/notifications/in-app:
    get:
      summary: List persisted in-app notifications
      description: |
        Requires both ROLE_SYSTEM_ADMIN and PERMISSION_NOTIFICATION_ADMIN.
        Results are ordered by delivery time and notification identifier descending.
      security:
        - bearerAuth: []
      parameters:
        - name: recipient
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 320
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Persisted in-app notification page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InAppNotificationPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/notifications/in-app/{notificationId}/read:
    patch:
      summary: Mark an in-app notification as read
      description: |
        Requires both ROLE_SYSTEM_ADMIN and PERMISSION_NOTIFICATION_ADMIN.
        The operation is idempotent and preserves the first read timestamp.
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated in-app notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InAppNotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request is malformed, invalid, or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Bearer credential missing, expired, or invalid. The security filter chain may return this response without a body.
    Forbidden:
      description: Authenticated, but missing the required role or permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: The requested resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotAcceptable:
      description: The requested response media type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: The request conflicts with existing resource or domain state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Gone:
      description: The requested resource or replay window is no longer available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: The request body exceeds the supported size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: The request Content-Type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Locked:
      description: The resource is temporarily locked by an in-progress operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimitExceeded:
      description: The caller exceeded an enforced request or concurrency limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: The service could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadGateway:
      description: An upstream dependency returned an invalid response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: The service or a required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    SendNotificationRequest:
      type: object
      additionalProperties: false
      required: [channel, recipient, subject, body]
      properties:
        channel: { type: string, enum: [EMAIL, SMS, IN_APP] }
        recipient: { type: string, minLength: 1, maxLength: 320 }
        subject: { type: string, minLength: 1, maxLength: 300 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        correlationId: { type: [string, 'null'], maxLength: 100 }
        idempotencyKey: { type: [string, 'null'], maxLength: 100 }
    NotificationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - channel
        - recipient
        - subject
        - status
        - createdAt
        - deliveryAttempts
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [EMAIL, SMS, IN_APP] }
        recipient: { type: string, maxLength: 320 }
        subject: { type: string, maxLength: 300 }
        status: { type: string, enum: [REQUESTED, DELIVERING, SENT, FAILED] }
        correlationId: { type: [string, 'null'], maxLength: 100 }
        createdAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        failedAt: { type: [string, 'null'], format: date-time }
        errorCode: { type: [string, 'null'], maxLength: 100 }
        errorMessage: { type: [string, 'null'], maxLength: 500 }
        failureRetryable: { type: [boolean, 'null'] }
        deliveryAttempts: { type: integer, minimum: 0, maximum: 5 }
    InAppNotificationResponse:
      type: object
      additionalProperties: false
      required: [notificationId, recipient, subject, body, deliveredAt, readAt]
      properties:
        notificationId: { type: string, format: uuid }
        recipient: { type: string, minLength: 1, maxLength: 320 }
        subject: { type: string, minLength: 1, maxLength: 300 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        deliveredAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    InAppNotificationPageResponse:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/InAppNotificationResponse'
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }
        first: { type: boolean }
        last: { type: boolean }
    ApiError:
      type: object
      description: |
        Uniform error body for every AgriCore service, defined by ApiError in common-lib.
        `code` is the stable machine-readable discriminator and is part of the public contract.
        Null fields are omitted, so `violations`, `details`, and `traceId` are absent unless set.
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string, description: HTTP reason phrase }
        code: { type: string, example: DUPLICATE_RESOURCE }
        message: { type: string }
        path: { type: string }
        traceId: { type: string }
        violations:
          type: array
          description: Present only when code is VALIDATION_FAILED.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        details:
          type: object
          additionalProperties: true
