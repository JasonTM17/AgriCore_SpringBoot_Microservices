openapi: 3.1.0
info:
  title: AgriCore Identity Service API
  version: 1.4.0
  description: |
    Authentication, users, RBAC, and migration-owned permission policy.
    Browser clients should prefer `/api/v1/auth/web/*` so refresh credentials stay
    in an HttpOnly cookie. Non-browser clients continue to use JSON refresh tokens.
    Pre-release compatibility note: version 1.4.0 intentionally removes runtime
    permission creation and makes permission-policy replacement versioned and audited.
servers:
  - url: http://localhost:8081
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/auth/login:
    post:
      summary: Login (returns access + refresh tokens in body)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token (JSON body for non-browser clients)
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/auth/logout:
    post:
      summary: Revoke refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/auth/web/login:
    post:
      summary: Browser login - refresh token only via HttpOnly cookie
      operationId: webLogin
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Access token issued; Set-Cookie carries refresh credential
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly SameSite refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthTokensResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/auth/web/refresh:
    post:
      summary: Browser refresh - reads and rotates HttpOnly cookie
      operationId: webRefresh
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: New access token; cookie rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthTokensResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/web/logout:
    post:
      summary: Browser logout - clears HttpOnly refresh cookie
      operationId: webLogout
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '204':
          description: Logged out and cookie cleared
          headers:
            Set-Cookie:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/me:
    get:
      summary: Current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/users:
    get:
      summary: List users for administration
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged users ordered by creation time descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/users/{userId}/roles:
    patch:
      summary: Replace a user's role set
      operationId: updateUserRoles
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesRequest'
      responses:
        '200':
          description: Roles replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/admin/permissions:
    get:
      summary: List the immutable canonical permission catalog
      description: Only migration-owned, assignable permission definitions are returned.
      operationId: listPermissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Permissions ordered by code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/roles/{roleCode}/permissions:
    parameters:
      - name: roleCode
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RoleCode'
    get:
      summary: Get the permission grants for a role
      operationId: getRolePermissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current role permission grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace the canonical permission grants for a role
      description: |
        The replacement is atomic and requires the current policy version plus an audit reason.
        Unknown or non-canonical permission codes and stale versions leave the existing grant set unchanged.
        Legacy non-assignable grants are retained for rollback/audit but are not returned or effective.
      operationId: replaceRolePermissions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolePermissionsRequest'
      responses:
        '200':
          description: Permission grants replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /.well-known/jwks.json:
    get:
      summary: JSON Web Key Set
      operationId: getJwks
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwkSet'
components:
  parameters:
    OriginHeader:
      name: Origin
      in: header
      required: false
      description: Browser origin; required for web cookie endpoints (Referer fallback accepted)
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 2147483646
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Values above 100 are capped to 100 by the service.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
        default: 20
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request is malformed, invalid, or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Bearer credential missing, expired, or invalid. The security filter chain may return this response without a body.
    Forbidden:
      description: Authenticated, but missing the required role or permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: The requested resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotAcceptable:
      description: The requested response media type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: The request conflicts with existing resource or domain state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Gone:
      description: The requested resource or replay window is no longer available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: The request body exceeds the supported size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: The request Content-Type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Locked:
      description: The resource is temporarily locked by an in-progress operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimitExceeded:
      description: The caller exceeded an enforced request or concurrency limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: The service could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadGateway:
      description: An upstream dependency returned an invalid response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: The service or a required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email, minLength: 1, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128, pattern: '\S', writeOnly: true }
        fullName: { type: string, minLength: 2, maxLength: 200, pattern: '\S' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 1 }
        password: { type: string, minLength: 1, maxLength: 128, pattern: '\S', writeOnly: true }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, pattern: '\S', writeOnly: true }
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, pattern: '\S', writeOnly: true }
    AuthTokensResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, minLength: 1 }
        refreshToken: { type: string, minLength: 1 }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64 }
        user:
          $ref: '#/components/schemas/UserResponse'
    WebAuthTokensResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      description: Browser response without refreshToken (cookie only)
      properties:
        accessToken: { type: string, minLength: 1 }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64 }
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required: [id, email, fullName, status, roles, permissions, lastLoginAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 320 }
        fullName: { type: string, maxLength: 200 }
        status: { type: string, enum: [ACTIVE, LOCKED, DISABLED] }
        roles:
          type: array
          maxItems: 7
          uniqueItems: true
          description: |
            Sorted role codes. Auth token responses match the issued JWT snapshot;
            `/users/me` reflects the authenticated bearer token snapshot.
          items:
            $ref: '#/components/schemas/RoleCode'
        permissions:
          type: array
          maxItems: 100
          uniqueItems: true
          description: |
            Sorted effective canonical permissions. Auth token responses match the issued JWT
            snapshot; `/users/me` reflects the authenticated bearer token snapshot.
          items:
            $ref: '#/components/schemas/PermissionCode'
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt: { type: string, format: date-time }
    RoleCode:
      type: string
      enum:
        - SYSTEM_ADMIN
        - FARM_MANAGER
        - AGRONOMIST
        - FIELD_WORKER
        - WAREHOUSE_MANAGER
        - SALES_STAFF
        - AUDITOR
    UpdateUserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCode'
    PermissionCode:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[A-Z][A-Z0-9_]{2,63}$'
    UpdateRolePermissionsRequest:
      type: object
      additionalProperties: false
      required: [permissionCodes, expectedVersion, reason]
      properties:
        permissionCodes:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionCode'
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
    PermissionResponse:
      type: object
      additionalProperties: false
      required: [id, code, name, description, createdAt, catalogVersion]
      properties:
        id: { type: string, format: uuid }
        code:
          $ref: '#/components/schemas/PermissionCode'
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
        createdAt: { type: string, format: date-time }
        catalogVersion: { type: integer, format: int32, minimum: 1 }
    RolePermissionsResponse:
      type: object
      additionalProperties: false
      required: [role, version, permissions]
      properties:
        role:
          $ref: '#/components/schemas/RoleCode'
        version:
          type: integer
          format: int64
          minimum: 1
        permissions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PermissionResponse'
    PermissionPageResponse:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PermissionResponse'
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }
        first: { type: boolean }
        last: { type: boolean }
    UserPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, format: int32, minimum: 0, maximum: 2147483646 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }
        first: { type: boolean }
        last: { type: boolean }
    ApiError:
      type: object
      description: |
        Uniform error body for every AgriCore service, defined by ApiError in common-lib.
        `code` is the stable machine-readable discriminator and is part of the public contract.
        Null fields are omitted, so `violations`, `details`, and `traceId` are absent unless set.
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string, description: HTTP reason phrase }
        code: { type: string, example: DUPLICATE_RESOURCE }
        message: { type: string }
        path: { type: string }
        traceId: { type: string }
        violations:
          type: array
          description: Present only when code is VALIDATION_FAILED.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        details:
          type: object
          additionalProperties: true
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
        rejectedValue: {}
    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Jwk'
    Jwk:
      type: object
      required: [kty, use, alg, kid, n, e]
      properties:
        kty: { type: string, enum: [RSA] }
        use: { type: string, enum: [sig] }
        alg: { type: string, enum: [RS256] }
        kid: { type: string, minLength: 1 }
        n: { type: string, minLength: 1 }
        e: { type: string, minLength: 1 }
