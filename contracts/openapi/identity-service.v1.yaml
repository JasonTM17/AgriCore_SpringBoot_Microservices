openapi: 3.1.0
info:
  title: AgriCore Identity Service API
  version: 1.3.0
  description: |
    Authentication, users, RBAC.
    Browser clients should prefer `/api/v1/auth/web/*` so refresh credentials stay
    in an HttpOnly cookie. Non-browser clients continue to use JSON refresh tokens.
servers:
  - url: http://localhost:8081
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Registration disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Content-Type is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/login:
    post:
      summary: Login (returns access + refresh tokens in body)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '423':
          description: Account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Content-Type is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token (JSON body for non-browser clients)
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Account inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Content-Type is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/logout:
    post:
      summary: Revoke refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
        '400':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Content-Type is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/web/login:
    post:
      summary: Browser login - refresh token only via HttpOnly cookie
      operationId: webLogin
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '400':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: Access token issued; Set-Cookie carries refresh credential
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly SameSite refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthTokensResponse'
        '403':
          description: Origin rejected or account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '423':
          description: Account temporarily locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Login rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Content-Type is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/web/refresh:
    post:
      summary: Browser refresh - reads and rotates HttpOnly cookie
      operationId: webRefresh
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: New access token; cookie rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthTokensResponse'
        '401':
          description: Missing or invalid refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Origin rejected or account inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/web/logout:
    post:
      summary: Browser logout - clears HttpOnly refresh cookie
      operationId: webLogout
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '204':
          description: Logged out and cookie cleared
          headers:
            Set-Cookie:
              schema:
                type: string
        '403':
          description: Origin rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/me:
    get:
      summary: Current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/users:
    get:
      summary: List users for administration
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged users ordered by creation time descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '400':
          description: Invalid paging parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: System administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/users/{userId}/roles:
    patch:
      summary: Replace a user's role set
      operationId: updateUserRoles
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesRequest'
      responses:
        '200':
          description: Roles replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid user ID or role set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: System administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Content-Type is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/permissions:
    get:
      summary: List permissions for administration
      operationId: listPermissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Permissions ordered by code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPageResponse'
        '400':
          description: Invalid paging parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { description: Authentication required }
        '403': { description: System administrator role required }
    post:
      summary: Create a permission
      operationId: createPermission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionRequest'
      responses:
        '201':
          description: Permission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'
        '400':
          description: Invalid permission fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { description: Authentication required }
        '403': { description: System administrator role required }
        '409':
          description: Permission code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415': { description: Content-Type is not supported }
  /api/v1/admin/roles/{roleCode}/permissions:
    parameters:
      - name: roleCode
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RoleCode'
    get:
      summary: Get the permission grants for a role
      operationId: getRolePermissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current role permission grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionsResponse'
        '400': { description: Invalid role code }
        '401': { description: Authentication required }
        '403': { description: System administrator role required }
        '404': { description: Role not found }
    put:
      summary: Replace the permission grants for a role
      description: The replacement is atomic; an unknown permission leaves the existing grant set unchanged.
      operationId: replaceRolePermissions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolePermissionsRequest'
      responses:
        '200':
          description: Permission grants replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionsResponse'
        '400':
          description: Invalid role code or permission set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { description: Authentication required }
        '403': { description: System administrator role required }
        '404':
          description: Role or requested permission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415': { description: Content-Type is not supported }
  /.well-known/jwks.json:
    get:
      summary: JSON Web Key Set
      operationId: getJwks
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwkSet'
components:
  parameters:
    OriginHeader:
      name: Origin
      in: header
      required: false
      description: Browser origin; required for web cookie endpoints (Referer fallback accepted)
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 2147483646
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Values above 100 are capped to 100 by the service.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
        default: 20
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email, minLength: 1, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128, pattern: '\S', writeOnly: true }
        fullName: { type: string, minLength: 2, maxLength: 200, pattern: '\S' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 1 }
        password: { type: string, minLength: 1, maxLength: 128, pattern: '\S', writeOnly: true }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, pattern: '\S', writeOnly: true }
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, pattern: '\S', writeOnly: true }
    AuthTokensResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, minLength: 1 }
        refreshToken: { type: string, minLength: 1 }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64 }
        user:
          $ref: '#/components/schemas/UserResponse'
    WebAuthTokensResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      description: Browser response without refreshToken (cookie only)
      properties:
        accessToken: { type: string, minLength: 1 }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64 }
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required: [id, email, fullName, status, roles, lastLoginAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 320 }
        fullName: { type: string, maxLength: 200 }
        status: { type: string, enum: [ACTIVE, LOCKED, DISABLED] }
        roles:
          type: array
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCode'
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt: { type: string, format: date-time }
    RoleCode:
      type: string
      enum:
        - SYSTEM_ADMIN
        - FARM_MANAGER
        - AGRONOMIST
        - FIELD_WORKER
        - WAREHOUSE_MANAGER
        - SALES_STAFF
        - AUDITOR
    UpdateUserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCode'
    PermissionCode:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[A-Z][A-Z0-9_]{2,63}$'
    CreatePermissionRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
    UpdateRolePermissionsRequest:
      type: object
      additionalProperties: false
      required: [permissionCodes]
      properties:
        permissionCodes:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionCode'
    PermissionResponse:
      type: object
      additionalProperties: false
      required: [id, code, name, description, createdAt]
      properties:
        id: { type: string, format: uuid }
        code:
          $ref: '#/components/schemas/PermissionCode'
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
        createdAt: { type: string, format: date-time }
    RolePermissionsResponse:
      type: object
      additionalProperties: false
      required: [role, permissions]
      properties:
        role:
          $ref: '#/components/schemas/RoleCode'
        permissions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PermissionResponse'
    PermissionPageResponse:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PermissionResponse'
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }
        first: { type: boolean }
        last: { type: boolean }
    UserPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, format: int32, minimum: 0, maximum: 2147483646 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }
        first: { type: boolean }
        last: { type: boolean }
    ApiError:
      type: object
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        traceId:
          type: [string, 'null']
        violations:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        details:
          type: object
          additionalProperties: true
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
        rejectedValue: {}
    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Jwk'
    Jwk:
      type: object
      required: [kty, use, alg, kid, n, e]
      properties:
        kty: { type: string, enum: [RSA] }
        use: { type: string, enum: [sig] }
        alg: { type: string, enum: [RS256] }
        kid: { type: string, minLength: 1 }
        n: { type: string, minLength: 1 }
        e: { type: string, minLength: 1 }
