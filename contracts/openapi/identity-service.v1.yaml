openapi: 3.1.0
info:
  title: AgriCore Identity Service API
  version: 1.0.0
  description: Authentication, users, RBAC
servers:
  - url: http://localhost:8081
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens issued
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token
      operationId: refresh
      responses:
        '200':
          description: New tokens
  /api/v1/auth/logout:
    post:
      summary: Revoke refresh token
      operationId: logout
      responses:
        '204':
          description: Logged out
  /api/v1/users/me:
    get:
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
  /api/v1/admin/users:
    get:
      summary: List users
      description: Requires SYSTEM_ADMIN. Page size is capped at 100 server-side.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of users
        '403':
          description: Caller is not SYSTEM_ADMIN
  /api/v1/admin/users/{userId}/roles:
    patch:
      summary: Replace a user's roles
      description: Requires SYSTEM_ADMIN.
      operationId: updateUserRoles
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesRequest'
      responses:
        '200':
          description: Updated user
        '403':
          description: Caller is not SYSTEM_ADMIN
        '404':
          description: User not found
  /.well-known/jwks.json:
    get:
      summary: JSON Web Key Set
      responses:
        '200':
          description: JWKS
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        fullName: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateUserRolesRequest:
      type: object
      required: [roles]
      description: Replaces the user's role set outright; it is not additive.
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [SYSTEM_ADMIN, FARM_MANAGER, AGRONOMIST, FIELD_WORKER, WAREHOUSE_MANAGER, SALES_STAFF, AUDITOR]
