openapi: 3.1.0
info:
  title: AgriCore IoT Service API
  version: 1.1.0
  description: Farm-scoped device registration, sensor reading ingestion, and threshold alert evaluation.
servers:
  - url: http://localhost:8090
    description: Direct local service endpoint
security:
  - bearerAuth: []
tags:
  - name: IoT
paths:
  /api/v1/iot/devices:
    post:
      tags: [IoT]
      operationId: registerIotDevice
      summary: Register an IoT device for a plot
      description: Requires SYSTEM_ADMIN, FARM_MANAGER, or AGRONOMIST plus access to the request plot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/iot/readings:
    post:
      tags: [IoT]
      operationId: ingestIotReading
      summary: Store a sensor reading and evaluate threshold alerts
      description: Requires SYSTEM_ADMIN, FARM_MANAGER, AGRONOMIST, or FIELD_WORKER plus access to the registered device plot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestReadingRequest'
      responses:
        '200':
          description: Reading accepted and any matching threshold rule evaluated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Malformed JSON or request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication is required or the bearer token is invalid.
    Forbidden:
      description: The authenticated user lacks the required role or plot access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Device, plot, or owning farm not found or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Device code already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: Content-Type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Farm authorization is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotAcceptable:
      description: The requested response media type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Gone:
      description: The requested resource or replay window is no longer available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: The request body exceeds the supported size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Locked:
      description: The resource is temporarily locked by an in-progress operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimitExceeded:
      description: The caller exceeded an enforced request or concurrency limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: The service could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadGateway:
      description: An upstream dependency returned an invalid response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    RegisterDeviceRequest:
      type: object
      required: [deviceCode, plotId, name]
      properties:
        deviceCode: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        plotId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
    IngestReadingRequest:
      type: object
      required: [deviceCode, metricType, metricValue, unit]
      properties:
        readingId:
          type: [string, 'null']
          format: uuid
          description: Optional stable reading identifier used for idempotent HTTP/MQTT ingestion.
        deviceCode: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        metricType: { type: string, minLength: 1, maxLength: 64 }
        metricValue:
          type: number
          minimum: -9999999999.9999
          maximum: 9999999999.9999
          multipleOf: 0.0001
        unit: { type: string, minLength: 1, maxLength: 16 }
        recordedAt: { type: [string, 'null'], format: date-time }
    DeviceResponse:
      type: object
      additionalProperties: false
      required: [id, deviceCode, plotId, name, status, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        deviceCode: { type: string, maxLength: 64 }
        plotId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        status: { type: string, maxLength: 32 }
        lastSeenAt: { type: [string, 'null'], format: date-time }
    IngestResultResponse:
      type: object
      additionalProperties: false
      required: [readingId, alertRaised, alertId, alertStatus, message]
      properties:
        readingId: { type: string, format: uuid }
        alertRaised: { type: boolean }
        alertId: { type: [string, 'null'], format: uuid }
        alertStatus: { type: [string, 'null'] }
        message: { type: string }
    ApiError:
      type: object
      description: |
        Uniform error body for every AgriCore service, defined by ApiError in common-lib.
        `code` is the stable machine-readable discriminator and is part of the public contract.
        Null fields are omitted, so `violations`, `details`, and `traceId` are absent unless set.
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string, description: HTTP reason phrase }
        code: { type: string, example: DUPLICATE_RESOURCE }
        message: { type: string }
        path: { type: string }
        traceId: { type: string }
        violations:
          type: array
          description: Present only when code is VALIDATION_FAILED.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        details:
          type: object
          additionalProperties: true
    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
