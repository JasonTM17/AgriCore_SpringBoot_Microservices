openapi: 3.1.0
info:
  title: AgriCore Crop Cycle Service API
  version: 1.1.0
  description: Verified crop-cycle planning and stage workflow contract.
servers:
  - url: http://localhost:8084
    description: Direct local service endpoint
security:
  - bearerAuth: []
tags:
  - name: Crop Cycles
paths:
  /api/v1/crop-cycles:
    get:
      tags: [Crop Cycles]
      operationId: listCropCycles
      summary: List crop cycles
      parameters:
        - in: query
          name: farmId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: plotId
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Crop cycles ordered by creation time descending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCyclePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Crop Cycles]
      operationId: createCropCycle
      summary: Create a crop cycle
      description: Requires SYSTEM_ADMIN, FARM_MANAGER, or AGRONOMIST.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCropCycleRequest'
      responses:
        '201':
          description: Crop cycle created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/crop-cycles/{cycleId}:
    parameters:
      - $ref: '#/components/parameters/CycleId'
    get:
      tags: [Crop Cycles]
      operationId: getCropCycle
      summary: Get a crop cycle
      responses:
        '200':
          description: Crop cycle found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/crop-cycles/{cycleId}/stage:
    parameters:
      - $ref: '#/components/parameters/CycleId'
    post:
      tags: [Crop Cycles]
      operationId: changeCropCycleStage
      summary: Change a crop-cycle stage
      description: Requires SYSTEM_ADMIN, FARM_MANAGER, or AGRONOMIST and a legal transition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStageRequest'
      responses:
        '200':
          description: Stage updated, or the requested stage was already current.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CycleId:
      in: path
      name: cycleId
      required: true
      schema: { type: string, format: uuid }
    Page:
      in: query
      name: page
      description: Zero-based page index.
      schema: { type: integer, format: int32, minimum: 0, default: 0 }
    Size:
      in: query
      name: size
      description: Number of records per page.
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: Invalid path, query, JSON, dates, stage, or validation input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication is required or the bearer token is invalid.
    Forbidden:
      description: The authenticated user lacks the required role.
    NotFound:
      description: Crop cycle not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Duplicate code, overlapping dates, terminal cycle, or illegal stage transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: Content-Type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Failed to persist the transactional outbox event.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    CycleStage:
      type: string
      enum: [PLANNED, LAND_PREPARATION, SOWING, GROWING, FERTILIZING, PEST_CONTROL, HARVESTING, COMPLETED, CANCELLED]
    CycleStatus:
      type: string
      enum: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
    CreateCropCycleRequest:
      type: object
      required: [code, farmId, plotId, cropId, plannedStartDate]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        farmId: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        cropVarietyId: { type: [string, 'null'], format: uuid }
        plannedStartDate: { type: string, format: date }
        plannedEndDate: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
    ChangeStageRequest:
      type: object
      required: [stage]
      properties:
        stage:
          $ref: '#/components/schemas/CycleStage'
        notes: { type: [string, 'null'] }
    CropCycleResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - farmId
        - plotId
        - cropId
        - cropVarietyId
        - plannedStartDate
        - plannedEndDate
        - actualStartDate
        - actualEndDate
        - stage
        - status
        - notes
        - createdAt
        - updatedAt
        - version
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        farmId: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        cropVarietyId: { type: [string, 'null'], format: uuid }
        plannedStartDate: { type: string, format: date }
        plannedEndDate: { type: [string, 'null'], format: date }
        actualStartDate: { type: [string, 'null'], format: date }
        actualEndDate: { type: [string, 'null'], format: date }
        stage:
          $ref: '#/components/schemas/CycleStage'
        status:
          $ref: '#/components/schemas/CycleStatus'
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    CropCyclePageResponse:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CropCycleResponse'
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }
        first: { type: boolean }
        last: { type: boolean }
    ApiError:
      type: object
      additionalProperties: false
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, format: int32, minimum: 400, maximum: 599 }
        error: { type: string }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        traceId: { type: [string, 'null'] }
        violations:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        details:
          type: object
          additionalProperties: true
    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
