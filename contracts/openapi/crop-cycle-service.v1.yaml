openapi: 3.1.0
info:
  title: AgriCore Crop Cycle Service API
  version: 1.0.0
  description: Season planning and stage workflow for plots
servers:
  - url: http://localhost:8084
paths:
  /api/v1/crop-cycles:
    get:
      summary: List crop cycles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: farmId
          schema: { type: string, format: uuid }
        - in: query
          name: plotId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paged crop cycles
    post:
      summary: Create crop cycle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCropCycleRequest'
      responses:
        '201':
          description: Created
        '409':
          description: Overlap or duplicate code
  /api/v1/crop-cycles/{cycleId}:
    get:
      summary: Get crop cycle
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Crop cycle
  /api/v1/crop-cycles/{cycleId}/stage:
    post:
      summary: Advance crop cycle stage (legal transitions only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStageRequest'
      responses:
        '200':
          description: Stage updated
        '409':
          description: Illegal transition or terminal cycle
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateCropCycleRequest:
      type: object
      required: [code, farmId, plotId, cropId, plannedStartDate]
      properties:
        code: { type: string }
        farmId: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        cropVarietyId: { type: string, format: uuid }
        plannedStartDate: { type: string, format: date }
        plannedEndDate: { type: string, format: date }
        notes: { type: string }
    ChangeStageRequest:
      type: object
      required: [stage]
      properties:
        stage:
          type: string
          enum:
            - PLANNED
            - LAND_PREPARATION
            - SOWING
            - GROWING
            - FERTILIZING
            - PEST_CONTROL
            - HARVESTING
            - COMPLETED
            - CANCELLED
        notes: { type: string }
