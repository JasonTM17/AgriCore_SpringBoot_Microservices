openapi: 3.1.0
info:
  title: AgriCore Crop Catalog Service API
  version: 1.0.0
  description: Crop types, varieties, and growth requirements
servers:
  - url: http://localhost:8083
paths:
  /api/v1/crops:
    get:
      summary: List crops
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paged crops
  /api/v1/crops/{cropId}:
    get:
      summary: Get crop
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: cropId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Crop detail
  /api/v1/crops/by-code/{code}:
    get:
      summary: Get crop by catalog code
      description: Lookup is case-insensitive; codes are stored uppercase.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: code
          required: true
          description: Catalog code such as RICE_ST25
          schema: { type: string }
      responses:
        '200':
          description: Crop detail
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
