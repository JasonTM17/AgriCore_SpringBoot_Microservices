openapi: 3.1.0
info:
  title: AgriCore Crop Catalog Service API
  version: 1.0.0
  description: Crop types, varieties, and growth requirements
servers:
  - url: http://localhost:8083
paths:
  /api/v1/crops:
    get:
      summary: List crops
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paged crops
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/crops/{cropId}:
    get:
      summary: Get crop
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: cropId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Crop detail
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/crops/by-code/{code}:
    get:
      summary: Get crop by catalog code
      description: Lookup is case-insensitive; codes are stored uppercase.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: code
          required: true
          description: Catalog code such as RICE_ST25
          schema: { type: string }
      responses:
        '200':
          description: Crop detail
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      description: |
        Uniform error body for every AgriCore service, defined by ApiError in common-lib.
        `code` is the stable machine-readable discriminator and is part of the public contract.
        Null fields are omitted, so `violations`, `details`, and `traceId` are absent unless set.
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string, description: HTTP reason phrase }
        code: { type: string, example: DUPLICATE_RESOURCE }
        message: { type: string }
        path: { type: string }
        traceId: { type: string }
        violations:
          type: array
          description: Present only when code is VALIDATION_FAILED.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
              rejectedValue: { description: Whatever the caller sent; untyped by design }
        details:
          type: object
          additionalProperties: true
  responses:
    NotFound:
      description: No such resource. The code is service-specific.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: |
        Bearer credential missing, expired, or invalid. Produced by the security filter chain
        before the DispatcherServlet, so this is the one error on the platform that is NOT
        ApiError-shaped and carries no body.
    UnexpectedError:
      description: Any other failure, including 500 INTERNAL_ERROR and 405 METHOD_NOT_ALLOWED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationFailed:
      description: |
        Request body failed validation (code VALIDATION_FAILED, with violations populated), or a
        path variable or query parameter would not convert (code INVALID_PARAMETER).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
