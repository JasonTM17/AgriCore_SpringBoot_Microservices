openapi: 3.1.0
info:
  title: AgriCore Assistant Service API
  version: 1.0.0
  description: Conversations, capabilities, and authenticated SSE generation events.
servers:
  - url: http://localhost:8093
paths:
  /api/v1/assistant/capabilities:
    get:
      summary: Provider capabilities
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Capabilities
  /api/v1/assistant/conversations:
    get:
      summary: List owner conversations
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Conversation list }
    post:
      summary: Create conversation
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
  /api/v1/assistant/conversations/{conversationId}/messages:
    get:
      summary: List messages
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Messages }
  /api/v1/assistant/conversations/{conversationId}/generations:
    post:
      summary: Start generation (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Generation accepted }
        '503': { description: Provider unavailable }
  /api/v1/assistant/conversations/{conversationId}/generations/{generationId}/events:
    get:
      summary: SSE generation events
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: generationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: after
          in: query
          schema: { type: integer, format: int64, default: -1 }
      responses:
        '200':
          description: text/event-stream
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
