openapi: 3.1.0
info:
  title: AgriCore Farm Service API
  version: 1.0.0
  description: Farms, areas, and plots management
servers:
  - url: http://localhost:8082
paths:
  /api/v1/farms:
    get:
      summary: List farms
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: sort
          schema: { type: string }
        - in: query
          name: province
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Paged farm list
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    post:
      summary: Create farm
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFarmRequest'
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/farms/{farmId}:
    get:
      summary: Get farm by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: Farm
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    patch:
      summary: Update farm
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FarmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFarmRequest'
      responses:
        '200':
          description: Updated
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/farms/{farmId}/plots:
    get:
      summary: List plots for farm
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: Plot list
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    post:
      summary: Create plot
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FarmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlotRequest'
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/plots/{plotId}:
    get:
      summary: Get plot
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlotId'
      responses:
        '200':
          description: Plot
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    patch:
      summary: Update plot
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlotRequest'
      responses:
        '200':
          description: Updated
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FarmId:
      in: path
      name: farmId
      required: true
      schema: { type: string, format: uuid }
    PlotId:
      in: path
      name: plotId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ApiError:
      type: object
      description: |
        Uniform error body for every AgriCore service, defined by ApiError in common-lib.
        `code` is the stable machine-readable discriminator and is part of the public contract.
        Null fields are omitted, so `violations`, `details`, and `traceId` are absent unless set.
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string, description: HTTP reason phrase }
        code: { type: string, example: DUPLICATE_RESOURCE }
        message: { type: string }
        path: { type: string }
        traceId: { type: string }
        violations:
          type: array
          description: Present only when code is VALIDATION_FAILED.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
              rejectedValue: { description: Whatever the caller sent; untyped by design }
        details:
          type: object
          additionalProperties: true
    CreateFarmRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        address: { type: string }
        province: { type: string }
        totalAreaHa: { type: number }
        latitude: { type: number }
        longitude: { type: number }
    UpdateFarmRequest:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        province: { type: string }
        totalAreaHa: { type: number }
        status: { type: string, enum: [ACTIVE, INACTIVE, MAINTENANCE] }
        latitude: { type: number }
        longitude: { type: number }
    CreatePlotRequest:
      type: object
      required: [code, name, areaInHectares]
      properties:
        code: { type: string }
        name: { type: string }
        areaInHectares: { type: number }
        soilType: { type: string }
        latitude: { type: number }
        longitude: { type: number }
    UpdatePlotRequest:
      type: object
      properties:
        name: { type: string }
        areaInHectares: { type: number }
        soilType: { type: string }
        status: { type: string, enum: [AVAILABLE, PREPARING, IN_USE, RESTING, MAINTENANCE, INACTIVE] }
        latitude: { type: number }
        longitude: { type: number }
  responses:
    Conflict:
      description: |
        The request collides with existing state. A losing race on a unique index reports
        DUPLICATE_RESOURCE; services also use 409 for their own domain conflicts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated but lacking the required role (code ACCESS_DENIED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: No such resource. The code is service-specific.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: |
        Bearer credential missing, expired, or invalid. Produced by the security filter chain
        before the DispatcherServlet, so this is the one error on the platform that is NOT
        ApiError-shaped and carries no body.
    UnexpectedError:
      description: Any other failure, including 500 INTERNAL_ERROR and 405 METHOD_NOT_ALLOWED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationFailed:
      description: |
        Request body failed validation (code VALIDATION_FAILED, with violations populated), or a
        path variable or query parameter would not convert (code INVALID_PARAMETER).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
