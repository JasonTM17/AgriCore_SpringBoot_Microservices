openapi: 3.1.0
info:
  title: AgriCore Work Service API
  version: 1.0.0
  description: Field work tasks assignment and completion
servers:
  - url: http://localhost:8085
paths:
  /api/v1/work-tasks:
    post:
      summary: Create work task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, cropCycleId, plotId, taskType, title]
              properties:
                code: { type: string }
                cropCycleId: { type: string, format: uuid }
                plotId: { type: string, format: uuid }
                taskType: { type: string }
                title: { type: string }
                priority: { type: string }
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/UnexpectedError' }
    get:
      summary: List work tasks
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cropCycleId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          description: Clamped to 100 by the service
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paged work tasks
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/work-tasks/{taskId}:
    get:
      summary: Get work task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Work task detail
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/work-tasks/{taskId}/assign:
    post:
      summary: Assign task to employee
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedEmployeeId]
              properties:
                assignedEmployeeId: { type: string, format: uuid }
      responses:
        '200':
          description: Assigned
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/work-tasks/{taskId}/complete:
    post:
      summary: Complete task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        '200':
          description: Completed
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      description: |
        Uniform error body for every AgriCore service, defined by ApiError in common-lib.
        `code` is the stable machine-readable discriminator and is part of the public contract.
        Null fields are omitted, so `violations`, `details`, and `traceId` are absent unless set.
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string, description: HTTP reason phrase }
        code: { type: string, example: DUPLICATE_RESOURCE }
        message: { type: string }
        path: { type: string }
        traceId: { type: string }
        violations:
          type: array
          description: Present only when code is VALIDATION_FAILED.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
              rejectedValue: { description: Whatever the caller sent; untyped by design }
        details:
          type: object
          additionalProperties: true
  responses:
    Conflict:
      description: |
        The request collides with existing state. A losing race on a unique index reports
        DUPLICATE_RESOURCE; services also use 409 for their own domain conflicts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated but lacking the required role (code ACCESS_DENIED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: No such resource. The code is service-specific.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: |
        Bearer credential missing, expired, or invalid. Produced by the security filter chain
        before the DispatcherServlet, so this is the one error on the platform that is NOT
        ApiError-shaped and carries no body.
    UnexpectedError:
      description: Any other failure, including 500 INTERNAL_ERROR and 405 METHOD_NOT_ALLOWED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationFailed:
      description: |
        Request body failed validation (code VALIDATION_FAILED, with violations populated), or a
        path variable or query parameter would not convert (code INVALID_PARAMETER).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
