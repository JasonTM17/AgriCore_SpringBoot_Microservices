openapi: 3.1.0
info:
  title: AgriCore Traceability Service API
  version: 1.4.0
  description: Verified public-safe traceability lookup, QR image, and privileged projection read/write contract.
servers:
  - url: http://localhost:8092
    description: Direct local service endpoint
security:
  - bearerAuth: []
tags:
  - name: Public Traceability
  - name: Traceability Projection
paths:
  /public/api/v1/traceability/{traceabilityCode}:
    parameters:
      - in: path
        name: traceabilityCode
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
    get:
      tags: [Public Traceability]
      operationId: getPublicTraceability
      summary: Look up public product origin information
      description: Returns only public-safe fields; no internal identifiers, staff data, costs, or secrets.
      security: []
      responses:
        '200':
          description: Public traceability projection found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTraceabilityResponse'
        '404':
          description: Traceability code not found or projection not yet available.
  /public/api/v1/traceability/{traceabilityCode}/qr:
    parameters:
      - in: path
        name: traceabilityCode
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
    get:
      tags: [Public Traceability]
      operationId: getPublicTraceabilityQrCode
      summary: Render a traceability URL as a QR image
      security: []
      responses:
        '200':
          description: Scannable PNG containing the canonical public traceability URL.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
        '404':
          description: Traceability code not found or projection not yet available.
  /api/v1/traceability/batches:
    post:
      tags: [Traceability Projection]
      operationId: createTraceabilityBatch
      summary: Create or replay a traceability projection
      description: Privileged backfill/event-adapter endpoint for SYSTEM_ADMIN or WAREHOUSE_MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTraceabilityRequest'
      responses:
        '201':
          description: Projection created, or the existing idempotent projection returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTraceabilityResponse'
        '400':
          description: Invalid JSON or validation input.
        '401':
          description: Authentication is required or the bearer token is invalid.
        '403':
          description: SYSTEM_ADMIN or WAREHOUSE_MANAGER role is required.
        '409':
          description: The event was recorded previously but its projection row is missing.
        '415':
          description: Content-Type is not supported.
  /api/v1/traceability/events/harvest-completed/{eventId}/acknowledgement:
    get:
      tags: [Traceability Projection]
      operationId: getTraceabilityHarvestProjectionAcknowledgement
      summary: Read traceability acknowledgement for a harvest event
      description: Marker absence means traceability has not acknowledged the event; it does not prove failure or DLT routing.
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current traceability consumer acknowledgement state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceabilityHarvestProjectionAcknowledgementResponse'
        '400': { description: Invalid event identifier }
        '401': { description: Authentication required }
        '403': { description: Harvest workflow role required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TraceabilityHarvestProjectionAcknowledgementResponse:
      type: object
      additionalProperties: false
      required: [eventId, projection, state, acknowledgedAt]
      properties:
        eventId: { type: string, format: uuid }
        projection: { type: string, enum: [TRACEABILITY] }
        state: { type: string, enum: [ACKNOWLEDGED, NOT_ACKNOWLEDGED] }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
    CreateTraceabilityRequest:
      type: object
      required: [eventId, harvestBatchId, productName, harvestDate]
      properties:
        eventId: { type: string, format: uuid }
        harvestBatchId: { type: string, format: uuid }
        cropCycleId: { type: [string, 'null'], format: uuid }
        plotId: { type: [string, 'null'], format: uuid }
        farmName: { type: [string, 'null'], maxLength: 200 }
        plotCode: { type: [string, 'null'], maxLength: 64 }
        productName: { type: string, minLength: 1, maxLength: 200 }
        varietyName: { type: [string, 'null'], maxLength: 200 }
        plantingDate: { type: [string, 'null'], format: date }
        harvestDate: { type: string, format: date }
        qualityGrade: { type: [string, 'null'], maxLength: 32 }
        netWeightKg:
          type: [number, 'null']
          minimum: 0.001
          maximum: 99999999999.999
          multipleOf: 0.001
        careSummary: { type: [string, 'null'], maxLength: 1000 }
        productCode: { type: [string, 'null'], maxLength: 64 }
        grossWeightKg:
          type: [number, 'null']
          minimum: 0.001
          maximum: 99999999999.999
          multipleOf: 0.001
    PublicTraceabilityResponse:
      type: object
      additionalProperties: false
      required:
        - traceabilityCode
        - productName
        - varietyName
        - farmName
        - plotCode
        - productCode
        - plantingDate
        - harvestDate
        - qualityGrade
        - grossWeightKg
        - netWeightKg
        - careSummary
        - qrUrl
        - qrImageUrl
        - batchLabel
      properties:
        traceabilityCode: { type: string, maxLength: 64 }
        productName: { type: string, maxLength: 200 }
        varietyName: { type: [string, 'null'], maxLength: 200 }
        farmName: { type: [string, 'null'], maxLength: 200 }
        plotCode: { type: [string, 'null'], maxLength: 64 }
        productCode: { type: [string, 'null'], maxLength: 64 }
        plantingDate: { type: [string, 'null'], format: date }
        harvestDate: { type: string, format: date }
        qualityGrade: { type: [string, 'null'], maxLength: 32 }
        grossWeightKg: { type: [number, 'null'], minimum: 0.001 }
        netWeightKg: { type: [number, 'null'] }
        careSummary: { type: [string, 'null'] }
        qrUrl: { type: string, maxLength: 500 }
        qrImageUrl: { type: string, maxLength: 503 }
        batchLabel: { type: string }
