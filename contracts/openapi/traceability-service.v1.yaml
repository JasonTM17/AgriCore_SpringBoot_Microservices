openapi: 3.1.0
info:
  title: AgriCore Traceability Service API
  version: 1.0.0
  description: Local read model + public QR lookup (no secrets/staff costs)
servers:
  - url: http://localhost:8092
paths:
  /public/api/v1/traceability/{traceabilityCode}:
    get:
      summary: Public product origin lookup
      parameters:
        - in: path
          name: traceabilityCode
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public-safe fields only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTraceabilityResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/traceability/batches:
    post:
      summary: Internal projection writer (also fed by Kafka HarvestCompleted)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, harvestBatchId, productName, harvestDate]
              properties:
                eventId: { type: string }
                harvestBatchId: { type: string, format: uuid }
                cropCycleId: { type: string, format: uuid }
                plotId: { type: string, format: uuid }
                farmName: { type: string }
                plotCode: { type: string }
                productName: { type: string }
                varietyName: { type: string }
                plantingDate: { type: string, format: date }
                harvestDate: { type: string, format: date }
                qualityGrade: { type: string }
                netWeightKg: { type: number }
                careSummary: { type: string }
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/UnexpectedError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      description: |
        Uniform error body for every AgriCore service, defined by ApiError in common-lib.
        `code` is the stable machine-readable discriminator and is part of the public contract.
        Null fields are omitted, so `violations`, `details`, and `traceId` are absent unless set.
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string, description: HTTP reason phrase }
        code: { type: string, example: DUPLICATE_RESOURCE }
        message: { type: string }
        path: { type: string }
        traceId: { type: string }
        violations:
          type: array
          description: Present only when code is VALIDATION_FAILED.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
              rejectedValue: { description: Whatever the caller sent; untyped by design }
        details:
          type: object
          additionalProperties: true
    PublicTraceabilityResponse:
      type: object
      properties:
        traceabilityCode: { type: string }
        productName: { type: string }
        varietyName: { type: string }
        farmName: { type: string }
        plotCode: { type: string }
        plantingDate: { type: string, format: date }
        harvestDate: { type: string, format: date }
        qualityGrade: { type: string }
        netWeightKg: { type: number }
        careSummary: { type: string }
        qrUrl: { type: string }
        batchLabel: { type: string }
  responses:
    Conflict:
      description: |
        The request collides with existing state. A losing race on a unique index reports
        DUPLICATE_RESOURCE; services also use 409 for their own domain conflicts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated but lacking the required role (code ACCESS_DENIED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: No such resource. The code is service-specific.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: |
        Bearer credential missing, expired, or invalid. Produced by the security filter chain
        before the DispatcherServlet, so this is the one error on the platform that is NOT
        ApiError-shaped and carries no body.
    UnexpectedError:
      description: Any other failure, including 500 INTERNAL_ERROR and 405 METHOD_NOT_ALLOWED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationFailed:
      description: |
        Request body failed validation (code VALIDATION_FAILED, with violations populated), or a
        path variable or query parameter would not convert (code INVALID_PARAMETER).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
