openapi: 3.1.0
info:
  title: AgriCore Sales Service API
  version: 1.0.0
  description: |
    Customers and sales orders with inventory reservation saga.
    Flow: create order → reserve stock → confirm reservation → CONFIRMED.
servers:
  - url: http://localhost:8091
paths:
  /api/v1/sales/customers:
    post:
      summary: Create customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '201':
          description: Created
        '409':
          description: Customer code exists
  /api/v1/sales/orders:
    post:
      summary: Place order (saga reserve + confirm inventory)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNumber, customerId, inventoryItemId, quantity]
              properties:
                orderNumber: { type: string }
                customerId: { type: string, format: uuid }
                inventoryItemId: { type: string, format: uuid }
                quantity: { type: number }
      responses:
        '201':
          description: Terminal saga outcome (CONFIRMED, OUT_OF_STOCK, or CANCELLED)
  /api/v1/sales/orders/{orderId}:
    get:
      summary: Get order and saga status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order detail
        '404':
          description: Not found
  /api/v1/sales/orders/{orderId}/reconcile:
    post:
      summary: Reconcile a stuck inventory hold
      description: |
        Recovery path for an order whose saga stopped between reserving and confirming, leaving
        stock held. RELEASE returns the hold and cancels the order; CONFIRM fulfils it. Both are
        idempotent — repeating the action that already ran returns the current order unchanged.

        Requires the order to still carry a reservation; an order with none is a 409, because there
        is nothing to reconcile.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: action
          required: true
          description: Case-insensitive
          schema:
            type: string
            enum: [RELEASE, CONFIRM]
      responses:
        '200':
          description: Order after reconciliation
        '400':
          description: action missing or blank
        '404':
          description: Order not found
        '409':
          description: Order has no inventory reservation to reconcile
        '502':
          description: Inventory service could not complete the reconciliation
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
