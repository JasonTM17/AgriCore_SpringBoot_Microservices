openapi: 3.1.0
info:
  title: AgriCore Sales Service API
  version: 1.0.0
  description: |
    Customers and sales orders with inventory reservation saga.
    Flow: create order → reserve stock → confirm reservation → CONFIRMED.
servers:
  - url: http://localhost:8091
paths:
  /api/v1/sales/customers:
    post:
      summary: Create customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/sales/orders:
    post:
      summary: Place order (saga reserve + confirm inventory)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNumber, customerId, inventoryItemId, quantity]
              properties:
                orderNumber: { type: string }
                customerId: { type: string, format: uuid }
                inventoryItemId: { type: string, format: uuid }
                quantity: { type: number }
      responses:
        '201':
          description: Terminal saga outcome (CONFIRMED, OUT_OF_STOCK, or CANCELLED)
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/sales/orders/{orderId}:
    get:
      summary: Get order and saga status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order detail
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /api/v1/sales/orders/{orderId}/reconcile:
    post:
      summary: Reconcile a stuck inventory hold
      description: |
        Recovery path for an order whose saga stopped between reserving and confirming, leaving
        stock held. RELEASE returns the hold and cancels the order; CONFIRM fulfils it. Both are
        idempotent — repeating the action that already ran returns the current order unchanged.

        Requires the order to still carry a reservation; an order with none is a 409, because there
        is nothing to reconcile.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: action
          required: true
          description: Case-insensitive
          schema:
            type: string
            enum: [RELEASE, CONFIRM]
      responses:
        '200':
          description: Order after reconciliation
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/UpstreamFailure' }
        default: { $ref: '#/components/responses/UnexpectedError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      description: |
        Uniform error body for every AgriCore service, defined by ApiError in common-lib.
        `code` is the stable machine-readable discriminator and is part of the public contract.
        Null fields are omitted, so `violations`, `details`, and `traceId` are absent unless set.
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string, description: HTTP reason phrase }
        code: { type: string, example: DUPLICATE_RESOURCE }
        message: { type: string }
        path: { type: string }
        traceId: { type: string }
        violations:
          type: array
          description: Present only when code is VALIDATION_FAILED.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
              rejectedValue: { description: Whatever the caller sent; untyped by design }
        details:
          type: object
          additionalProperties: true
  responses:
    Conflict:
      description: |
        The request collides with existing state. A losing race on a unique index reports
        DUPLICATE_RESOURCE; services also use 409 for their own domain conflicts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated but lacking the required role (code ACCESS_DENIED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: No such resource. The code is service-specific.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: |
        Bearer credential missing, expired, or invalid. Produced by the security filter chain
        before the DispatcherServlet, so this is the one error on the platform that is NOT
        ApiError-shaped and carries no body.
    UnexpectedError:
      description: Any other failure, including 500 INTERNAL_ERROR and 405 METHOD_NOT_ALLOWED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UpstreamFailure:
      description: A downstream service could not complete the request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationFailed:
      description: |
        Request body failed validation (code VALIDATION_FAILED, with violations populated), or a
        path variable or query parameter would not convert (code INVALID_PARAMETER).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
