openapi: 3.1.0
info:
  title: AgriCore Sales Service API
  version: 2.0.0
  description: |
    Farm-scoped customers and sales orders with inventory reservation saga.
    Flow: create order → reserve stock → confirm reservation → fulfillment milestones.
servers:
  - url: http://localhost:8091
paths:
  /api/v1/sales/customers:
    post:
      summary: Create customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [farmId, code, name]
              properties:
                farmId: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, farmId, code, name]
                properties:
                  id: { type: string, format: uuid }
                  farmId: { type: string, format: uuid }
                  code: { type: string }
                  name: { type: string }
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/sales/orders:
    post:
      summary: Place order (saga reserve + confirm inventory)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderNumber, farmId, customerId, inventoryItemId, quantity]
              properties:
                orderNumber: { type: string }
                farmId: { type: string, format: uuid }
                customerId: { type: string, format: uuid }
                inventoryItemId: { type: string, format: uuid }
                quantity: { type: number }
                unitPrice: { type: [number, 'null'], minimum: 0, multipleOf: 0.0001 }
                currencyCode:
                  type: [string, 'null']
                  pattern: '^[A-Za-z]{3}$'
      responses:
        '201':
          description: >-
            Current saga outcome can be terminal (CONFIRMED, OUT_OF_STOCK, CANCELLED),
            retryable (RETRY_SCHEDULED), or STOCK_RESERVED while confirmation is retried.
            A bounded recovery worker marks exhausted sagas TIMED_OUT for manual review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/sales/orders/{orderId}:
    get:
      summary: Get order and saga status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order detail
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/sales/orders/{orderId}/reconcile:
    post:
      summary: Reconcile an order with its authoritative inventory reservation state
      description: >-
        RELEASE cancels the order when Inventory returns RELEASED. If Inventory reports
        that the reservation is already FULFILLED, the order is confirmed instead.
        CONFIRM is the only idempotent action for CONFIRMED; RELEASE is the only
        idempotent action for CANCELLED. Other terminal-state actions return 409.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: action
          required: true
          schema: { type: string, enum: [RELEASE, CONFIRM] }
      responses:
        '200':
          description: Reconciled order and saga state
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request is malformed, invalid, or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Bearer credential missing, expired, or invalid. The security filter chain may return this response without a body.
    Forbidden:
      description: Authenticated, but missing the required role or permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: The requested resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotAcceptable:
      description: The requested response media type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: The request conflicts with existing resource or domain state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Gone:
      description: The requested resource or replay window is no longer available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: The request body exceeds the supported size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: The request Content-Type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Locked:
      description: The resource is temporarily locked by an in-progress operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimitExceeded:
      description: The caller exceeded an enforced request or concurrency limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: The service could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadGateway:
      description: An upstream dependency returned an invalid response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: The service or a required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    SalesOrderItemResponse:
      type: object
      additionalProperties: false
      required: [lineNumber, inventoryItemId, quantity]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: number, minimum: 0.001 }
        unitPrice: { type: [number, 'null'], minimum: 0 }
        lineTotal: { type: [number, 'null'], minimum: 0 }
        currencyCode: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
    SalesOrderResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - orderNumber
        - farmId
        - customerId
        - status
        - inventoryItemId
        - quantity
        - correlationId
        - sagaStatus
        - sagaStep
        - createdAt
        - items
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        farmId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { type: string }
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: number }
        reservationId: { type: [string, 'null'], format: uuid }
        correlationId: { type: string, format: uuid }
        failureReason: { type: [string, 'null'] }
        sagaStatus: { type: [string, 'null'] }
        sagaStep: { type: [string, 'null'] }
        sagaRetryCount: { type: [integer, 'null'], minimum: 0 }
        sagaNextAttemptAt: { type: [string, 'null'], format: date-time }
        sagaCompletedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        currencyCode: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        subtotalAmount: { type: [number, 'null'], minimum: 0 }
        totalAmount: { type: [number, 'null'], minimum: 0 }
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderItemResponse'
    ApiError:
      type: object
      description: |
        Uniform error body for every AgriCore service, defined by ApiError in common-lib.
        `code` is the stable machine-readable discriminator and is part of the public contract.
        Null fields are omitted, so `violations`, `details`, and `traceId` are absent unless set.
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string, description: HTTP reason phrase }
        code: { type: string, example: DUPLICATE_RESOURCE }
        message: { type: string }
        path: { type: string }
        traceId: { type: string }
        violations:
          type: array
          description: Present only when code is VALIDATION_FAILED.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        details:
          type: object
          additionalProperties: true
