openapi: 3.1.0
info:
  title: AgriCore Sales Service API
  version: 1.1.0
  description: |
    Customers and sales orders with inventory reservation saga.
    Flow: create order → reserve stock → confirm reservation → CONFIRMED.
servers:
  - url: http://localhost:8091
paths:
  /api/v1/sales/customers:
    post:
      summary: Create customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '201':
          description: Created
        '409':
          description: Customer code exists
  /api/v1/sales/orders:
    post:
      summary: Place order (saga reserve + confirm inventory)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNumber, customerId, inventoryItemId, quantity]
              properties:
                orderNumber: { type: string }
                customerId: { type: string, format: uuid }
                inventoryItemId: { type: string, format: uuid }
                quantity: { type: number }
                unitPrice: { type: [number, 'null'], minimum: 0, multipleOf: 0.0001 }
                currencyCode:
                  type: [string, 'null']
                  pattern: '^[A-Za-z]{3}$'
      responses:
        '201':
          description: >-
            Current saga outcome: CONFIRMED, OUT_OF_STOCK, CANCELLED, or STOCK_RESERVED
            while failed compensation awaits reconciliation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
  /api/v1/sales/orders/{orderId}:
    get:
      summary: Get order and saga status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order detail
        '404':
          description: Not found
  /api/v1/sales/orders/{orderId}/reconcile:
    post:
      summary: Reconcile an order with its authoritative inventory reservation state
      description: >-
        RELEASE cancels the order when Inventory returns RELEASED. If Inventory reports
        that the reservation is already FULFILLED, the order is confirmed instead.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: action
          required: true
          schema: { type: string, enum: [RELEASE, CONFIRM] }
      responses:
        '200':
          description: Reconciled order and saga state
        '400':
          description: Invalid reconciliation action
        '409':
          description: Order has no inventory reservation
        '404':
          description: Order not found
        '502':
          description: Reconciliation could not be completed; read the order state again before retrying
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SalesOrderItemResponse:
      type: object
      additionalProperties: false
      required: [lineNumber, inventoryItemId, quantity]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: number, minimum: 0.001 }
        unitPrice: { type: [number, 'null'], minimum: 0 }
        lineTotal: { type: [number, 'null'], minimum: 0 }
        currencyCode: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
    SalesOrderResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - orderNumber
        - customerId
        - status
        - inventoryItemId
        - quantity
        - correlationId
        - sagaStatus
        - sagaStep
        - createdAt
        - items
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        customerId: { type: string, format: uuid }
        status: { type: string }
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: number }
        reservationId: { type: [string, 'null'], format: uuid }
        correlationId: { type: string, format: uuid }
        failureReason: { type: [string, 'null'] }
        sagaStatus: { type: [string, 'null'] }
        sagaStep: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        currencyCode: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        subtotalAmount: { type: [number, 'null'], minimum: 0 }
        totalAmount: { type: [number, 'null'], minimum: 0 }
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderItemResponse'
