openapi: 3.1.0
info:
  title: AgriCore Inventory Service API
  version: 1.1.0
  description: Warehouses, stock movements, reservations; Kafka HarvestCompleted consumer is idempotent
servers:
  - url: http://localhost:8086
paths:
  /api/v1/inventory/warehouses:
    post:
      summary: Create warehouse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
      responses:
        '201':
          description: Created
  /api/v1/inventory/reservations:
    post:
      summary: Reserve stock (optimistic concurrency)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryItemId, quantity, referenceType, referenceId]
              properties:
                inventoryItemId: { type: string, format: uuid }
                quantity: { type: number }
                referenceType: { type: string }
                referenceId: { type: string }
      responses:
        '201':
          description: Reserved
        '409':
          description: Insufficient stock
  /api/v1/inventory/reservations/{id}/release:
    post:
      summary: Release reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >-
            Current reservation state. RELEASED means the stock hold was removed;
            FULFILLED means inventory was already committed and can no longer be released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationReleaseResponse'
        '404':
          description: Reservation not found
  /api/v1/inventory/reservations/{id}/confirm:
    post:
      summary: Confirm reservation (fulfill - decrement on-hand and reserved)
      description: Sales saga confirm step. Idempotent when already FULFILLED.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fulfilled
        '409':
          description: Reservation not ACTIVE or insufficient on-hand
  /api/v1/inventory/events/harvest-completed:
    post:
      summary: Sync adapter for HarvestCompleted (same path as Kafka consumer)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarvestCompletedCommand'
      responses:
        '200':
          description: Stock applied (idempotent on eventId)
  /api/v1/inventory/events/harvest-completed/{eventId}/acknowledgement:
    get:
      operationId: getInventoryHarvestProjectionAcknowledgement
      summary: Read inventory acknowledgement for a harvest event
      description: Marker absence means inventory has not acknowledged the event; it does not prove failure or DLT routing.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current inventory consumer acknowledgement state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryHarvestProjectionAcknowledgementResponse'
        '400': { description: Invalid event identifier }
        '401': { description: Authentication required }
        '403': { description: Harvest workflow role required }
  /api/v1/inventory/items/{itemId}:
    get:
      summary: Get inventory item
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Item with onHand and reserved quantities
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ReservationReleaseResponse:
      type: object
      additionalProperties: false
      required: [id, inventoryItemId, quantity, status, referenceType, referenceId]
      properties:
        id: { type: string, format: uuid }
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: number }
        status: { type: string, enum: [RELEASED, FULFILLED] }
        referenceType: { type: string }
        referenceId: { type: string }
    InventoryHarvestProjectionAcknowledgementResponse:
      type: object
      additionalProperties: false
      required: [eventId, projection, state, acknowledgedAt]
      properties:
        eventId: { type: string, format: uuid }
        projection: { type: string, enum: [INVENTORY] }
        state: { type: string, enum: [ACKNOWLEDGED, NOT_ACKNOWLEDGED] }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
    HarvestCompletedCommand:
      type: object
      required: [eventId, harvestBatchId, warehouseId, productCode, netWeightKg]
      properties:
        eventId: { type: string }
        harvestBatchId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        productCode: { type: string }
        netWeightKg: { type: number }
        qualityGrade: { type: string }
