openapi: 3.1.0
info:
  title: AgriCore Inventory Service API
  version: 2.0.0
  description: |
    Farm-scoped warehouses, stock movements, reservations, and an idempotent
    HarvestCompleted consumer. Version 2 requires warehouseId when reading harvest
    acknowledgements so pending and completed states share the same authorization boundary.
servers:
  - url: http://localhost:8086
paths:
  /api/v1/inventory/warehouses:
    post:
      summary: Create warehouse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [farmId, code, name]
              properties:
                farmId: { type: string, format: uuid }
                code: { type: string, minLength: 1, maxLength: 64 }
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
  /api/v1/inventory/items:
    post:
      summary: Create an inventory item in a warehouse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryItemRequest'
      responses:
        '201':
          description: Inventory item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '404': { description: Warehouse not found }
        '409': { description: SKU already exists in the warehouse }
  /api/v1/inventory/stock-in:
    post:
      summary: Add stock and record the referenced ledger movement
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockInRequest'
      responses:
        '200':
          description: Updated inventory balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '404': { description: Inventory item not found }
  /api/v1/inventory/stock-out:
    post:
      summary: Deduct available stock idempotently by business reference
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockOutRequest'
      responses:
        '200':
          description: Updated inventory balance or the result of an idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '404': { description: Inventory item not found }
        '409': { description: Insufficient available stock or idempotency conflict }
  /internal/api/v1/inventory/stock-out:
    post:
      summary: Deduct task material from the authoritative farm inventory
      description: >-
        Internal Work service contract. The caller supplies the farm resolved from the task plot;
        Inventory returns 404 when the item is absent or belongs to another farm.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Internal-Service-Token
          required: true
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalStockOutRequest'
      responses:
        '200':
          description: Stock deducted or an idempotent replay resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '403': { description: Internal service authentication failed }
        '404': { description: Item absent from the authorized farm }
        '409': { description: Insufficient stock or idempotency conflict }
  /api/v1/inventory/reservations:
    post:
      summary: Reserve stock idempotently by business reference
      description: >-
        Repeating the same referenceType/referenceId with the same item and quantity returns the
        authoritative reservation without increasing the hold. Reusing a reference for a different
        request returns 409.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inventoryItemId, quantity, referenceType, referenceId]
              properties:
                inventoryItemId: { type: string, format: uuid }
                quantity: { type: number, minimum: 0.001, maximum: 999999999999999.999, multipleOf: 0.001 }
                referenceType: { type: string, minLength: 1, maxLength: 64 }
                referenceId: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '409':
          description: Insufficient stock or reference conflict
  /api/v1/inventory/reservations/by-reference:
    get:
      summary: Resolve the authoritative reservation for a business reference
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: referenceType
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: referenceId
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Current reservation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: Invalid or missing business reference
        '404':
          description: Reservation not found
  /api/v1/inventory/reservations/{id}/release:
    post:
      summary: Release reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >-
            Current reservation state. RELEASED means the stock hold was removed;
            FULFILLED means inventory was already committed and can no longer be released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationReleaseResponse'
        '404':
          description: Reservation not found
  /api/v1/inventory/reservations/{id}/confirm:
    post:
      summary: Confirm reservation (fulfill - decrement on-hand and reserved)
      description: Sales saga confirm step. Idempotent when already FULFILLED.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fulfilled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '409':
          description: Reservation not ACTIVE or insufficient on-hand
  /api/v1/inventory/events/harvest-completed:
    post:
      summary: Sync adapter for HarvestCompleted (same path as Kafka consumer)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarvestCompletedCommand'
      responses:
        '200':
          description: Stock applied (idempotent on eventId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
  /api/v1/inventory/events/harvest-completed/{eventId}/acknowledgement:
    get:
      operationId: getInventoryHarvestProjectionAcknowledgement
      summary: Read inventory acknowledgement for a harvest event
      description: Marker absence means inventory has not acknowledged the event; it does not prove failure or DLT routing.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: warehouseId
          required: true
          description: Warehouse scope used to authorize both pending and acknowledged states.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current inventory consumer acknowledgement state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryHarvestProjectionAcknowledgementResponse'
        '400': { description: Invalid event identifier }
        '401': { description: Authentication required }
        '403': { description: Harvest workflow role required }
        '404': { description: Warehouse not found }
        '503': { description: Farm authorization, warehouse scope, or legacy acknowledgement scope unavailable }
  /api/v1/inventory/items/{itemId}:
    get:
      summary: Get inventory item
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Item with onHand and reserved quantities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '404':
          description: Inventory item not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateInventoryItemRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, sku, name, itemType, unit]
      properties:
        warehouseId: { type: string, format: uuid }
        sku: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        itemType: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1, maxLength: 16 }
    StockInRequest:
      type: object
      additionalProperties: false
      required: [inventoryItemId, quantity, referenceType, referenceId]
      description: |
        Adds stock to an expiry-aware lot. Omitting lotCode derives a deterministic
        lot identity from referenceType/referenceId. Omitting expiresAt means the lot
        is not expiry-managed.
      properties:
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: number, minimum: 0.001, maximum: 999999999999999.999, multipleOf: 0.001 }
        referenceType: { type: string, minLength: 1, maxLength: 64 }
        referenceId: { type: string, minLength: 1, maxLength: 100 }
        note: { type: [string, 'null'], maxLength: 1000 }
        lotCode: { type: string, maxLength: 100 }
        expiresAt: { type: string, format: date-time }
    StockOutRequest:
      allOf:
        - $ref: '#/components/schemas/StockMutationRequest'
    StockMutationRequest:
      type: object
      additionalProperties: false
      required: [inventoryItemId, quantity, referenceType, referenceId]
      properties:
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: number, minimum: 0.001, maximum: 999999999999999.999, multipleOf: 0.001 }
        referenceType: { type: string, minLength: 1, maxLength: 64 }
        referenceId: { type: string, minLength: 1, maxLength: 100 }
        note: { type: [string, 'null'], maxLength: 1000 }
    WarehouseResponse:
      type: object
      additionalProperties: false
      required: [id, farmId, code, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    InternalStockOutRequest:
      type: object
      additionalProperties: false
      required: [farmId, inventoryItemId, quantity, referenceType, referenceId]
      properties:
        farmId: { type: string, format: uuid }
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: number, minimum: 0.001, multipleOf: 0.001 }
        referenceType: { type: string, minLength: 1, maxLength: 64 }
        referenceId: { type: string, minLength: 1, maxLength: 100 }
        note: { type: [string, 'null'], maxLength: 1000 }
    InventoryItemResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - warehouseId
        - sku
        - name
        - itemType
        - unit
        - onHandQuantity
        - reservedQuantity
        - availableQuantity
        - version
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        itemType: { type: string }
        unit: { type: string }
        onHandQuantity: { type: number }
        reservedQuantity: { type: number }
        availableQuantity: { type: number }
        version: { type: integer, format: int64, minimum: 0 }
    ReservationResponse:
      type: object
      additionalProperties: false
      required: [id, inventoryItemId, quantity, status, referenceType, referenceId]
      properties:
        id: { type: string, format: uuid }
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: number }
        status: { type: string, enum: [ACTIVE, RELEASED, FULFILLED] }
        referenceType: { type: string }
        referenceId: { type: string }
    ReservationReleaseResponse:
      type: object
      additionalProperties: false
      required: [id, inventoryItemId, quantity, status, referenceType, referenceId]
      properties:
        id: { type: string, format: uuid }
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: number }
        status: { type: string, enum: [RELEASED, FULFILLED] }
        referenceType: { type: string }
        referenceId: { type: string }
    InventoryHarvestProjectionAcknowledgementResponse:
      type: object
      additionalProperties: false
      required: [eventId, projection, state, acknowledgedAt]
      properties:
        eventId: { type: string, format: uuid }
        projection: { type: string, enum: [INVENTORY] }
        state: { type: string, enum: [ACKNOWLEDGED, NOT_ACKNOWLEDGED] }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
    HarvestCompletedCommand:
      type: object
      additionalProperties: false
      required: [eventId, harvestBatchId, warehouseId, productCode, netWeightKg]
      properties:
        eventId: { type: string, minLength: 1 }
        harvestBatchId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        productCode: { type: string, minLength: 1 }
        netWeightKg: { type: number, minimum: 0.001 }
        qualityGrade: { type: [string, 'null'] }
