openapi: 3.1.0
info:
  title: AgriCore Inventory Service API
  version: 1.0.0
  description: Warehouses, stock movements, reservations; Kafka HarvestCompleted consumer is idempotent
servers:
  - url: http://localhost:8086
paths:
  /api/v1/inventory/warehouses:
    post:
      summary: Create warehouse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
      responses:
        '201':
          description: Created
  /api/v1/inventory/items:
    post:
      summary: Create inventory item
      description: Requires SYSTEM_ADMIN or WAREHOUSE_MANAGER. SKU is unique per warehouse.
      operationId: createItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, sku, name, itemType, unit]
              properties:
                warehouseId: { type: string, format: uuid }
                sku: { type: string, maxLength: 64 }
                name: { type: string, maxLength: 200 }
                itemType: { type: string }
                unit: { type: string, maxLength: 16 }
      responses:
        '201':
          description: Created
        '403':
          description: Insufficient role
        '409':
          description: SKU already exists in that warehouse
  /api/v1/inventory/stock-in:
    post:
      summary: Record a stock-in movement
      description: Requires SYSTEM_ADMIN or WAREHOUSE_MANAGER. Returns the updated item.
      operationId: stockIn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryItemId, quantity, referenceType, referenceId]
              properties:
                inventoryItemId: { type: string, format: uuid }
                quantity: { type: number, minimum: 0.001 }
                referenceType: { type: string }
                referenceId: { type: string }
                note: { type: string }
      responses:
        '200':
          description: Updated item
        '403':
          description: Insufficient role
        '404':
          description: Item not found
  /api/v1/inventory/reservations:
    post:
      summary: Reserve stock (optimistic concurrency)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryItemId, quantity, referenceType, referenceId]
              properties:
                inventoryItemId: { type: string, format: uuid }
                quantity: { type: number }
                referenceType: { type: string }
                referenceId: { type: string }
      responses:
        '201':
          description: Reserved
        '409':
          description: Insufficient stock
  /api/v1/inventory/reservations/{id}/release:
    post:
      summary: Release reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Released
  /api/v1/inventory/reservations/{id}/confirm:
    post:
      summary: Confirm reservation (fulfill - decrement on-hand and reserved)
      description: Sales saga confirm step. Idempotent when already FULFILLED.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fulfilled
        '409':
          description: Reservation not ACTIVE or insufficient on-hand
  /api/v1/inventory/events/harvest-completed:
    post:
      summary: Sync adapter for HarvestCompleted (same path as Kafka consumer)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarvestCompletedCommand'
      responses:
        '200':
          description: Stock applied (idempotent on eventId)
  /api/v1/inventory/items/{itemId}:
    get:
      summary: Get inventory item
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Item with onHand and reserved quantities
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HarvestCompletedCommand:
      type: object
      required: [eventId, harvestBatchId, warehouseId, productCode, netWeightKg]
      properties:
        eventId: { type: string }
        harvestBatchId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        productCode: { type: string }
        netWeightKg: { type: number }
        qualityGrade: { type: string }
