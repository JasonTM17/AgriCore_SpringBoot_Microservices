openapi: 3.1.0
info:
  title: AgriCore Harvest Service API
  version: 1.5.0
  description: Farm-scoped harvest completion and detail contract backed by a transactional outbox.
servers:
  - url: http://localhost:8087
    description: Direct local service endpoint
security:
  - bearerAuth: []
tags:
  - name: Harvests
paths:
  /api/v1/harvests/complete:
    post:
      tags: [Harvests]
      operationId: completeHarvest
      summary: Record a completed harvest and enqueue HarvestCompleted.v1
      description: Requires SYSTEM_ADMIN, FARM_MANAGER, AGRONOMIST, or WAREHOUSE_MANAGER plus access to the request plot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteHarvestRequest'
      responses:
        '201':
          description: Harvest recorded; inventory and traceability projection has started but is not yet acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/harvests/{harvestId}:
    parameters:
      - $ref: '#/components/parameters/HarvestId'
    get:
      tags: [Harvests]
      operationId: getHarvest
      summary: Get a harvest batch
      description: Requires access to the harvest plot. Returns the stable event identifier for current records.
      responses:
        '200':
          description: Harvest batch found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/harvests/{harvestId}/completion-event:
    parameters:
      - $ref: '#/components/parameters/HarvestId'
    get:
      tags: [Harvests]
      operationId: getHarvestCompletionEventStatus
      summary: Get HarvestCompleted producer delivery state
      description: Requires access to the harvest plot. PUBLISHED means Kafka delivery completed; it does not mean downstream projections acknowledged the event.
      responses:
        '200':
          description: Current producer delivery state, including an explicit unavailable state for legacy harvests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestCompletionEventStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/harvests/{harvestId}/completion-event/republish:
    parameters:
      - $ref: '#/components/parameters/HarvestId'
    post:
      tags: [Harvests]
      operationId: republishHarvestCompletionEvent
      summary: Requeue the stable HarvestCompleted event
      description: |
        Requires a harvest-completion role and access to the harvest plot. Requeues the original
        persisted outbox row and envelope without creating another harvest or event identity.
        Repeated requests are idempotent while the event is already pending. Corrupt persisted
        event invariants are rejected, and a contended repair lock is retryable.
      responses:
        '202':
          description: The original event is pending publication, or was already pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestCompletionEventStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    HarvestId:
      in: path
      name: harvestId
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid path, JSON, validation input, or net weight greater than gross weight.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication is required or the bearer token is invalid.
    Forbidden:
      description: The authenticated user lacks the required role or plot access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Harvest batch, plot, or owning farm not found or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Harvest batch code already exists or a persisted completion event invariant is broken.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: Content-Type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Failed to persist the transactional outbox event.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Farm authorization or completion-event locking is temporarily unavailable; retry later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HarvestStatus:
      type: string
      enum: [RECORDED, COMPLETED, CANCELLED]
    CompleteHarvestRequest:
      type: object
      required: [code, cropCycleId, plotId, warehouseId, productCode, grossWeightKg, netWeightKg, qualityGrade]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        cropCycleId: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        productCode: { type: string, minLength: 1, maxLength: 64 }
        grossWeightKg: { type: number, minimum: 0.001, maximum: 99999999999.999, multipleOf: 0.001 }
        netWeightKg: { type: number, minimum: 0.001, maximum: 99999999999.999, multipleOf: 0.001 }
        qualityGrade: { type: string, minLength: 1, maxLength: 32 }
        notes: { type: [string, 'null'] }
        farmName: { type: [string, 'null'], maxLength: 200 }
        plotCode: { type: [string, 'null'], maxLength: 64 }
        productName: { type: [string, 'null'], maxLength: 200 }
        careSummary: { type: [string, 'null'], maxLength: 1000 }
    HarvestBatchResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - cropCycleId
        - plotId
        - warehouseId
        - productCode
        - grossWeightKg
        - netWeightKg
        - qualityGrade
        - status
        - harvestedAt
        - notes
        - lastOutboxEventId
        - createdAt
        - version
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        cropCycleId: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        productCode: { type: string, maxLength: 64 }
        grossWeightKg: { type: number, minimum: 0.001 }
        netWeightKg: { type: number, minimum: 0.001 }
        qualityGrade: { type: string, maxLength: 32 }
        status:
          $ref: '#/components/schemas/HarvestStatus'
        harvestedAt: { type: string, format: date-time }
        notes: { type: [string, 'null'] }
        lastOutboxEventId:
          type: [string, 'null']
          format: uuid
          description: Stable HarvestCompleted event identity; null only for legacy records created before identity persistence.
        createdAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    HarvestCompletionEventStatusResponse:
      type: object
      additionalProperties: false
      required: [harvestId, eventId, producer, state, createdAt, publishedAt, publishAttempts]
      properties:
        harvestId: { type: string, format: uuid }
        eventId:
          type: [string, 'null']
          format: uuid
          description: Stable HarvestCompleted identity; null only for legacy harvests.
        producer: { type: string, enum: [HARVEST] }
        state: { type: string, enum: [UNAVAILABLE, ENQUEUED, RETRYING, PUBLISHED] }
        createdAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        publishAttempts: { type: integer, format: int32, minimum: 0 }
    ApiError:
      type: object
      additionalProperties: false
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, format: int32, minimum: 400, maximum: 599 }
        error: { type: string }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        traceId: { type: [string, 'null'] }
        violations:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        details:
          type: object
          additionalProperties: true
    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
