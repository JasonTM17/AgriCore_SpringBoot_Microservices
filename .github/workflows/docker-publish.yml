name: docker-publish

# Publish only the current default-branch revision after its CI run succeeds.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: nguyenson1710

jobs:
  resolve-sha:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    outputs:
      publish_sha: ${{ steps.sha.outputs.publish_sha }}
      should_publish: ${{ steps.sha.outputs.should_publish }}
    steps:
      - name: Checkout current branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1

      - name: Resolve verified revision
        id: sha
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          if [[ "$current_sha" != "$VERIFIED_SHA" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "publish_sha=" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale CI revision $VERIFIED_SHA; branch now points to $current_sha"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "publish_sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve-sha
    if: needs.resolve-sha.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            context: .
            file: services/identity-service/Dockerfile
            image: agricore-identity
          - service: farm
            context: .
            file: services/farm-service/Dockerfile
            image: agricore-farm
          - service: crop-catalog
            context: .
            file: services/crop-catalog-service/Dockerfile
            image: agricore-crop-catalog
          - service: crop-cycle
            context: .
            file: services/crop-cycle-service/Dockerfile
            image: agricore-crop-cycle
          - service: work
            context: .
            file: services/work-service/Dockerfile
            image: agricore-work
          - service: inventory
            context: .
            file: services/inventory-service/Dockerfile
            image: agricore-inventory
          - service: harvest
            context: .
            file: services/harvest-service/Dockerfile
            image: agricore-harvest
          - service: notification
            context: .
            file: services/notification-service/Dockerfile
            image: agricore-notification
          - service: iot
            context: .
            file: services/iot-service/Dockerfile
            image: agricore-iot
          - service: sales
            context: .
            file: services/sales-service/Dockerfile
            image: agricore-sales
          - service: traceability
            context: .
            file: services/traceability-service/Dockerfile
            image: agricore-traceability
          - service: gateway
            context: .
            file: services/api-gateway/Dockerfile
            image: agricore-gateway
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-sha.outputs.publish_sha }}
          fetch-depth: 1

      - name: Verify checked out revision
        shell: bash
        env:
          VERIFIED_SHA: ${{ needs.resolve-sha.outputs.publish_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
