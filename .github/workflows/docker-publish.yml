name: docker-publish

# Publish only after a successful default-branch CI run (immutable SHA), and only when the
# security scans passed for that same SHA. Manual dispatch may target main/master only and
# still resolves that branch tip.
#
# The trigger stays on `ci` alone. Listing trivy and codeql here as well would fire this
# workflow three times per push, each firing aware only of its own trigger's conclusion, and
# the concurrency group serialises rather than cancels — so the same twelve images would be
# built and pushed three times. Instead `ci` (the longest of the three) is the trigger and the
# other two conclusions are read back from the API for the resolved SHA.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  # Required to read the trivy and codeql conclusions for the resolved SHA.
  actions: read

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: nguyenson1710

jobs:
  resolve-sha:
    runs-on: ubuntu-latest
    outputs:
      publish_sha: ${{ steps.sha.outputs.publish_sha }}
      should_publish: ${{ steps.sha.outputs.should_publish }}
    steps:
      - name: Resolve publish SHA and eligibility
        id: sha
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_REPO: ${{ github.event.workflow_run.repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          GITHUB_SHA_FALLBACK: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          should=false
          publish_sha=""
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WR_REPO" == "$THIS_REPO" \
              && "$WR_EVENT" == "push" \
              && "$WR_CONCLUSION" == "success" \
              && ( "$WR_HEAD_BRANCH" == "main" || "$WR_HEAD_BRANCH" == "master" ) \
              && -n "$WR_HEAD_SHA" ]]; then
              should=true
              publish_sha="$WR_HEAD_SHA"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
              should=true
              publish_sha="$GITHUB_SHA_FALLBACK"
              # Manual dispatch is the recovery lever for a skipped publish, including one
              # skipped because a scan had not finished. Gating it on the same scans would
              # defeat its purpose, so it is exempt — and says so in the log.
              echo "gate: workflow_dispatch bypasses the scan gate for $publish_sha"
            fi
          fi

          # Trivy fails on CRITICAL/HIGH and codeql is the SAST pass; neither gated publication
          # before, so a commit that failed either still shipped twelve public images.
          if [[ "$should" == "true" && "$EVENT_NAME" == "workflow_run" ]]; then
            # per_page=100 rather than the default: a SHA re-run many times could otherwise push
            # the run being looked for off the first page.
            runs=$(gh api "repos/$THIS_REPO/actions/runs?head_sha=$publish_sha&per_page=100" \
              --jq '.workflow_runs | sort_by(.run_started_at) | .[] | "\(.name) \(.status) \(.conclusion // "none")"')
            for workflow in trivy codeql; do
              # Oldest to newest, so the last match wins and a re-run after a fix is what counts.
              # No match at all yields "missing none", which blocks: absence of evidence is not a
              # pass, and a typo in the workflow name must fail closed rather than wave a build
              # through.
              result=$(printf '%s\n' "$runs" \
                | awk -v wf="$workflow" '$1 == wf { s = $2; c = $3 } END { if (s == "") print "missing none"; else print s, c }')
              echo "gate: $workflow $result"
              if [[ "$result" != "completed success" ]]; then
                should=false
                echo "gate: blocking publish - $workflow did not pass for $publish_sha"
              fi
            done
            # A scan still running when ci finishes skips the publish rather than waiting for it.
            # Skips are recoverable with workflow_dispatch on main; polling would burn runner
            # minutes on every push. The reason is always printed, so a skip is explainable from
            # the run page.
          fi

          echo "should_publish=$should" >> "$GITHUB_OUTPUT"
          echo "publish_sha=$publish_sha" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should publish_sha=$publish_sha"

  publish:
    needs: resolve-sha
    if: needs.resolve-sha.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Twelve simultaneous builds resolve the same two Docker Hub base images at once.
      # Back-to-back pushes stack multiple runs, and the combined burst exceeds the
      # registry pull-rate limit (observed: HTTP 429 on every job of one run).
      max-parallel: 4
      matrix:
        include:
          - service: identity
            context: .
            file: services/identity-service/Dockerfile
            image: agricore-identity
          - service: farm
            context: .
            file: services/farm-service/Dockerfile
            image: agricore-farm
          - service: crop-catalog
            context: .
            file: services/crop-catalog-service/Dockerfile
            image: agricore-crop-catalog
          - service: crop-cycle
            context: .
            file: services/crop-cycle-service/Dockerfile
            image: agricore-crop-cycle
          - service: work
            context: .
            file: services/work-service/Dockerfile
            image: agricore-work
          - service: inventory
            context: .
            file: services/inventory-service/Dockerfile
            image: agricore-inventory
          - service: harvest
            context: .
            file: services/harvest-service/Dockerfile
            image: agricore-harvest
          - service: notification
            context: .
            file: services/notification-service/Dockerfile
            image: agricore-notification
          - service: iot
            context: .
            file: services/iot-service/Dockerfile
            image: agricore-iot
          - service: sales
            context: .
            file: services/sales-service/Dockerfile
            image: agricore-sales
          - service: traceability
            context: .
            file: services/traceability-service/Dockerfile
            image: agricore-traceability
          - service: gateway
            context: .
            file: services/api-gateway/Dockerfile
            image: agricore-gateway
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-sha.outputs.publish_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short SHA
        id: meta_sha
        shell: bash
        run: |
          full="${{ needs.resolve-sha.outputs.publish_sha }}"
          echo "short=${full:0:7}" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # Stamps org.opencontainers.image.revision so a pulled image can be traced back to
          # the commit it was built from. Without it the label would read "unknown".
          build-args: |
            GIT_SHA=${{ steps.meta_sha.outputs.full }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.meta_sha.outputs.short }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.meta_sha.outputs.full }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
