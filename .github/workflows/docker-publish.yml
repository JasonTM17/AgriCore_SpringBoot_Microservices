name: docker-publish

# Publish only after a successful default-branch CI run (immutable SHA).
# Manual dispatch may target main/master only and still resolves that branch tip.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: nguyenson1710
  GHCR_REGISTRY: ghcr.io

jobs:
  resolve-sha:
    runs-on: ubuntu-latest
    outputs:
      publish_sha: ${{ steps.sha.outputs.publish_sha }}
      should_publish: ${{ steps.sha.outputs.should_publish }}
    steps:
      - name: Resolve publish SHA and eligibility
        id: sha
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_REPO: ${{ github.event.workflow_run.repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          GITHUB_SHA_FALLBACK: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          should=false
          publish_sha=""
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WR_REPO" == "$THIS_REPO" \
              && "$WR_EVENT" == "push" \
              && "$WR_CONCLUSION" == "success" \
              && ( "$WR_HEAD_BRANCH" == "main" || "$WR_HEAD_BRANCH" == "master" ) \
              && -n "$WR_HEAD_SHA" ]]; then
              should=true
              publish_sha="$WR_HEAD_SHA"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
              should=true
              publish_sha="$GITHUB_SHA_FALLBACK"
            fi
          fi
          echo "should_publish=$should" >> "$GITHUB_OUTPUT"
          echo "publish_sha=$publish_sha" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should publish_sha=$publish_sha"

  publish:
    needs: resolve-sha
    if: needs.resolve-sha.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            context: .
            file: services/identity-service/Dockerfile
            image: agricore-identity
          - service: farm
            context: .
            file: services/farm-service/Dockerfile
            image: agricore-farm
          - service: crop-catalog
            context: .
            file: services/crop-catalog-service/Dockerfile
            image: agricore-crop-catalog
          - service: crop-cycle
            context: .
            file: services/crop-cycle-service/Dockerfile
            image: agricore-crop-cycle
          - service: work
            context: .
            file: services/work-service/Dockerfile
            image: agricore-work
          - service: inventory
            context: .
            file: services/inventory-service/Dockerfile
            image: agricore-inventory
          - service: harvest
            context: .
            file: services/harvest-service/Dockerfile
            image: agricore-harvest
          - service: notification
            context: .
            file: services/notification-service/Dockerfile
            image: agricore-notification
          - service: iot
            context: .
            file: services/iot-service/Dockerfile
            image: agricore-iot
          - service: sales
            context: .
            file: services/sales-service/Dockerfile
            image: agricore-sales
          - service: traceability
            context: .
            file: services/traceability-service/Dockerfile
            image: agricore-traceability
          - service: assistant
            context: .
            file: services/assistant-service/Dockerfile
            image: agricore-assistant
          - service: gateway
            context: .
            file: services/api-gateway/Dockerfile
            image: agricore-gateway
          - service: console
            context: .
            file: apps/agricore-console/Dockerfile
            image: agricore-console
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-sha.outputs.publish_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata inputs
        id: meta_sha
        shell: bash
        run: |
          full="${{ needs.resolve-sha.outputs.publish_sha }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "short=${full:0:7}"
            echo "full=$full"
            echo "ghcr_namespace=${{ env.GHCR_REGISTRY }}/$owner"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ steps.meta_sha.outputs.short }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ steps.meta_sha.outputs.full }}
            ${{ steps.meta_sha.outputs.ghcr_namespace }}/${{ matrix.image }}:latest
            ${{ steps.meta_sha.outputs.ghcr_namespace }}/${{ matrix.image }}:${{ steps.meta_sha.outputs.short }}
            ${{ steps.meta_sha.outputs.ghcr_namespace }}/${{ matrix.image }}:${{ steps.meta_sha.outputs.full }}
          labels: |
            org.opencontainers.image.created=${{ github.event.workflow_run.created_at || github.event.repository.updated_at }}
            org.opencontainers.image.description=AgriCore ${{ matrix.service }} application image
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ needs.resolve-sha.outputs.publish_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta_sha.outputs.full }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0
      - name: Sign Docker Hub immutable image digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: >-
          cosign sign --yes
          ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
      - name: Sign GitHub Packages immutable image digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: >-
          cosign sign --yes
          ${{ steps.meta_sha.outputs.ghcr_namespace }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
