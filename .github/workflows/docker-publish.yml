name: docker-publish

# Publish only after a successful default-branch CI run (immutable SHA).
# Manual dispatch may target main/master only and still resolves that branch tip.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: nguyenson1710

jobs:
  resolve-sha:
    runs-on: ubuntu-latest
    outputs:
      publish_sha: ${{ steps.sha.outputs.publish_sha }}
      should_publish: ${{ steps.sha.outputs.should_publish }}
    steps:
      - name: Resolve publish SHA and eligibility
        id: sha
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_REPO: ${{ github.event.workflow_run.repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          GITHUB_SHA_FALLBACK: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          should=false
          publish_sha=""
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WR_REPO" == "$THIS_REPO" \
              && "$WR_EVENT" == "push" \
              && "$WR_CONCLUSION" == "success" \
              && ( "$WR_HEAD_BRANCH" == "main" || "$WR_HEAD_BRANCH" == "master" ) \
              && -n "$WR_HEAD_SHA" ]]; then
              should=true
              publish_sha="$WR_HEAD_SHA"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
              should=true
              publish_sha="$GITHUB_SHA_FALLBACK"
            fi
          fi
          echo "should_publish=$should" >> "$GITHUB_OUTPUT"
          echo "publish_sha=$publish_sha" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should publish_sha=$publish_sha"

  publish:
    needs: resolve-sha
    if: needs.resolve-sha.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Twelve simultaneous builds resolve the same two Docker Hub base images at once.
      # Back-to-back pushes stack multiple runs, and the combined burst exceeds the
      # registry pull-rate limit (observed: HTTP 429 on every job of one run).
      max-parallel: 4
      matrix:
        include:
          - service: identity
            context: .
            file: services/identity-service/Dockerfile
            image: agricore-identity
          - service: farm
            context: .
            file: services/farm-service/Dockerfile
            image: agricore-farm
          - service: crop-catalog
            context: .
            file: services/crop-catalog-service/Dockerfile
            image: agricore-crop-catalog
          - service: crop-cycle
            context: .
            file: services/crop-cycle-service/Dockerfile
            image: agricore-crop-cycle
          - service: work
            context: .
            file: services/work-service/Dockerfile
            image: agricore-work
          - service: inventory
            context: .
            file: services/inventory-service/Dockerfile
            image: agricore-inventory
          - service: harvest
            context: .
            file: services/harvest-service/Dockerfile
            image: agricore-harvest
          - service: notification
            context: .
            file: services/notification-service/Dockerfile
            image: agricore-notification
          - service: iot
            context: .
            file: services/iot-service/Dockerfile
            image: agricore-iot
          - service: sales
            context: .
            file: services/sales-service/Dockerfile
            image: agricore-sales
          - service: traceability
            context: .
            file: services/traceability-service/Dockerfile
            image: agricore-traceability
          - service: gateway
            context: .
            file: services/api-gateway/Dockerfile
            image: agricore-gateway
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-sha.outputs.publish_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short SHA
        id: meta_sha
        shell: bash
        run: |
          full="${{ needs.resolve-sha.outputs.publish_sha }}"
          echo "short=${full:0:7}" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # Stamps org.opencontainers.image.revision so a pulled image can be traced back to
          # the commit it was built from. Without it the label would read "unknown".
          build-args: |
            GIT_SHA=${{ steps.meta_sha.outputs.full }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.meta_sha.outputs.short }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.meta_sha.outputs.full }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
