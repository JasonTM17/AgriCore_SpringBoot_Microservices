name: trivy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  fs-scan:
    name: filesystem (CRITICAL + HIGH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          # Fail the job when CRITICAL or HIGH vulnerabilities are found
          exit-code: "1"
          ignore-unfixed: true
          format: table
          # Exclude large build outputs and private agent dirs
          skip-dirs: "**/target,.claude,.grok,plans,mcps"
