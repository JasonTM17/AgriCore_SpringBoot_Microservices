name: trivy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  fs-scan:
    name: filesystem (CRITICAL + HIGH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          # Fail the job when CRITICAL or HIGH vulnerabilities are found
          exit-code: "1"
          ignore-unfixed: true
          format: table
          # Exclude large build outputs and private agent dirs
          skip-dirs: "**/target,.claude,.grok,plans,mcps"
