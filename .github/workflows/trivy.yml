name: trivy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  fs-scan:
    name: filesystem (CRITICAL + HIGH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          # Fail the job when CRITICAL or HIGH vulnerabilities are found
          exit-code: "1"
          ignore-unfixed: true
          format: table
          # Exclude large build outputs and private agent dirs
          skip-dirs: "**/target,.claude,.grok,plans,mcps"
