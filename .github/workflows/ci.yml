name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build and test (all microservices modules)
        run: ./mvnw -B verify
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint console
        run: pnpm lint
      - name: Typecheck console
        run: pnpm typecheck
      - name: Test console
        run: pnpm test
      - name: Build console
        run: pnpm build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Hard fail on secret findings (portfolio security gate)

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose (microservices stack)
        run: docker compose -f docker-compose.yml config --quiet
