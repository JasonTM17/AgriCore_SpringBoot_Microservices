name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build and test (all microservices modules)
        run: ./mvnw -B verify
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
      # Advisory until library/branch coverage reaches the documented targets
      # (docs/project-roadmap.md). Flipping this strict is a separate change that
      # binds jacoco:check; do not add -D thresholds here.
      - name: Coverage summary (advisory)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          shopt -s globstar nullglob
          printf '%-34s %10s %10s\n' MODULE INSTR BRANCH
          for csv in **/target/site/jacoco/jacoco.csv; do
            module="${csv%%/target/*}"
            awk -F, -v m="$module" '
              NR>1 { im+=$4; ic+=$5; bm+=$6; bc+=$7 }
              END {
                instr = (im+ic) ? ic*100/(im+ic) : 0
                branch = (bm+bc) ? bc*100/(bm+bc) : 0
                printf "%-34s %9.1f%% %9.1f%%\n", m, instr, branch
              }' "$csv"
          done
      - name: Upload coverage reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: "**/target/site/jacoco/**"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Hard fail on secret findings (portfolio security gate)

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose (microservices stack)
        run: docker compose -f docker-compose.yml config --quiet
