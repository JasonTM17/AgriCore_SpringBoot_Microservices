version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "maven"]

  # Every Dockerfile lives under services/<name>/. Pointed at "/" this found nothing, so the
  # builder and runtime base images were never offered an update while the config looked like
  # coverage. The glob also picks up a new service without another edit here.
  - package-ecosystem: docker
    directories:
      - "/services/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
